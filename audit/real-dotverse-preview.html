<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>DotVerse · Real Preview</title>
<link href='https://fonts.googleapis.com/css2?family=Syne:wght@300;400;500;600&family=Space+Grotesk:wght@300;400;500&family=IBM+Plex+Mono:wght@300;400&display=swap' rel='stylesheet'>
<style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
:root{
  /* ── Backgrounds — deep warm black ── */
  --bg:    #07080c;
  --s1:    rgba(255,248,230,.03);
  --s2:    rgba(255,248,230,.05);
  --s3:    rgba(255,248,230,.08);

  /* ── Gold borders — warm, not cold blue ── */
  --bd:    rgba(201,168,76,.12);
  --bd2:   rgba(201,168,76,.22);

  /* ── Warm white text hierarchy ── */
  --t1:    #ede8d8;
  --t2:    rgba(237,232,216,.62);
  --t3:    rgba(237,232,216,.30);
  --mut:   rgba(237,232,216,.38);
  --txt:   #ede8d8;

  /* ── GOLD — DotVerse brand, SOLID not opacity-faded ── */
  --gold:       #c9a84c;
  --gold2:      rgba(201,168,76,.08);
  --gold-glow:  rgba(201,168,76,.28);
  --gold-bord:  rgba(201,168,76,.32);

  /* ── Warm silver-white (replaces dead cold-blue crystal) ── */
  --crys:       rgba(237,232,216,.75);
  --crys2:      rgba(201,168,76,.07);
  --crys3:      rgba(201,168,76,.13);
  --crys-glow:  rgba(201,168,76,.22);
  --crys-bord:  rgba(201,168,76,.30);

  /* ── Legacy aliases — all wired to gold/warm-white now ── */
  --amb:     #c9a84c;
  --amb2:    rgba(201,168,76,.08);
  --cr:      #c9a84c;
  --orange:  #c9a84c;
  --yg:      rgba(237,232,216,.75);
  --yg2:     rgba(201,168,76,.07);
  --yg3:     rgba(201,168,76,.13);
  --yg-glow: rgba(201,168,76,.22);
  --topaz:   rgba(237,232,216,.75);
  --topazm:  rgba(237,232,216,.55);
  --topaz2:  rgba(201,168,76,.07);
  --line:    rgba(201,168,76,.09);

  /* ── Selection / active state ── */
  --sel-bg:   rgba(255,255,255,.06);
  --sel-bd:   rgba(201,168,76,.45);
  --sel-glow: rgba(201,168,76,.22);
  --sel-txt:  #c9a84c;

  /* ── Signal colors — unchanged ── */
  --grn:   #5de8a0;
  --red:   #e8706e;
  --grn2:  rgba(93,232,160,.08);
  --red2:  rgba(232,112,110,.08);
  --hold:  rgba(237,232,216,.55);

  /* ── Fonts ── */
  --mono: 'IBM Plex Mono',monospace;
  --ui:   'Space Grotesk',sans-serif;
  --syne: 'Syne',sans-serif;
}
body{background:var(--bg);color:var(--t1);font-family:var(--ui);-webkit-font-smoothing:antialiased;}

/* ── Syne headings ── */
h1,h2,h3,.hero-h1,.sig-word,.logo-text,.dash-section-title,.card-title,
.land-hero h1,.modal-title,.step-title,.onb-h{
  font-family:var(--syne) !important;
  letter-spacing:-.02em;
}

/* ── Default form element radius ── */
input,select,textarea{border-radius:6px !important;}
button{border-radius:6px !important;}

/* ── Gold focus glow ── */
input:focus,select:focus,textarea:focus{
  outline:none;
  border-color:rgba(201,168,76,.40) !important;
  box-shadow:0 0 0 2px rgba(201,168,76,.08) !important;
}

/* ── Global cursor + button reset ── */
button,[role="button"],[onclick]{cursor:pointer;}
button{background:none;border:none;font-family:inherit;font-size:inherit;}

/* ── Keyboard focus ring (gold) ── */
:focus-visible{
  outline:2px solid rgba(201,168,76,.60) !important;
  outline-offset:2px !important;
}
button:focus-visible,a:focus-visible,[onclick]:focus-visible{
  outline:2px solid rgba(201,168,76,.60) !important;
  outline-offset:2px !important;
  border-radius:2px !important;
}

/* ── Mobile layout (≤ 768px) ── */
@media(max-width:768px){
  .dsb{ display:none; }
  .dmain{ width:100vw; }
  .dcontent{ padding:16px 14px; }
  .dtop{ padding:0 14px; gap:8px; }
  .pg-hd{ flex-direction:column; gap:6px; align-items:flex-start; }
  .pg-hd-right{ margin-left:0; }
  .npp-strip{ overflow-x:auto; scrollbar-width:none; }
  .npp-strip::-webkit-scrollbar{ display:none; }
}
@media(max-width:480px){
  .dcontent{ padding:12px 10px; }
  .sz-layout{ grid-template-columns:1fr !important; }
  .opp-grid{ grid-template-columns:1fr !important; }
}

/* ── CANVAS ──────────────────────────────────── */
#gx{position:fixed;inset:0;z-index:0;pointer-events:none;}

/* ── VIEWS ───────────────────────────────────── */
.view{position:fixed;inset:0;z-index:1;display:none;}
.view.active{display:flex;}

/* ═══════════════════════════════════════════════
   LANDING / AUTH
═══════════════════════════════════════════════ */
#vLanding{flex-direction:row;}

.land-left{
  flex:1;
  display:flex;
  flex-direction:column;
  padding:32px 48px 40px;
  position:relative;
  overflow:hidden;
}
.land-logo{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:auto;
}
.logo-icon{width:28px;height:28px;flex-shrink:0;}
.logo-text{font-size:18px;font-weight:400;letter-spacing:-.3px;}

.land-hero{
  margin-top:auto;
  margin-bottom:0;
  padding-bottom:40px;
}
.hero-h1{
  font-size:clamp(32px,3.5vw,52px);
  font-weight:400;
  line-height:1.15;
  letter-spacing:-.02em;
  margin-bottom:0;
}
.hero-h1 em{font-style:normal;color:var(--amb);}
.hero-sub{
  font-size:16px;
  color:var(--t2);
  line-height:1.6;
  max-width:420px;
  margin-top:16px;
  margin-bottom:32px;
}
.flow-pills{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.fp{
  padding:5px 14px;
  border-radius:6px;
  border:1px solid var(--bd2);
  font-size:11.5px;
  font-weight:400;
  letter-spacing:.06em;
  color:var(--t2);
  background:rgba(255,255,255,.03);
}
.fp-arr{font-size:10px;color:var(--t3);}

.land-stats{
  display:flex;
  gap:12px;
  margin-top:40px;
}
.lstat{
  background:var(--s1);
  border:1px solid var(--bd);
  border-radius:6px;
  padding:16px 20px;
  flex:1;
}
.lstat-val{font-size:24px;font-weight:400;color:var(--t1);letter-spacing:-.02em;}
.lstat-val sup{font-size:14px;}
.lstat-lbl{font-size:11.5px;color:var(--t3);margin-top:3px;font-weight:400;}

/* auth panel */
.land-right{
  width:460px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
}
.auth-card{
  width:100%;
  max-height:calc(100vh - 48px);
  overflow-y:auto;
  background:var(--s1);
  border:1px solid var(--bd2);
  border-radius:6px;
  padding:28px;
  scrollbar-width:none;
}
.auth-card::-webkit-scrollbar{display:none;}
.auth-tabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:0;
  background:var(--s2);
  border-radius:6px;
  padding:3px;
  margin-bottom:28px;
}
.atab{
  padding:8px;
  text-align:center;
  font-size:13.5px;
  font-weight:400;
  color:var(--t2);
  border-radius:6px;
  cursor:pointer;
  transition:all .15s;
}
.atab.on{background:var(--s1);color:var(--t1);box-shadow:0 1px 3px rgba(0,0,0,.3);}
.auth-title{font-size:22px;font-weight:400;letter-spacing:-.02em;margin-bottom:4px;}
.auth-sub{font-size:13px;color:var(--t3);margin-bottom:24px;}

/* progress steps */
.prog-steps{
  display:flex;
  align-items:center;
  margin-bottom:28px;
}
.pstep{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:5px;
}
.pstep-num{
  width:28px;height:28px;
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:400;
  border:1.5px solid var(--bd2);
  color:var(--t3);
  transition:all .2s;
  flex-shrink:0;
}
.pstep.done .pstep-num{background:var(--grn);border-color:var(--grn);color:#000;}
.pstep.active .pstep-num{background:var(--amb);border-color:var(--amb);color:#000;}
.pstep-lbl{font-size:10px;color:var(--t3);font-weight:400;white-space:nowrap;}
.pstep.active .pstep-lbl{color:var(--t2);}
.pstep.done .pstep-lbl{color:var(--t3);}
.pconn{flex:1;height:1.5px;background:var(--bd2);margin:0 6px;margin-bottom:15px;transition:background .3s;}
.pconn.done{background:var(--grn);}

/* form fields */
.field{margin-bottom:16px;}
.field label{display:block;font-size:12px;font-weight:400;color:var(--t2);margin-bottom:5px;letter-spacing:.02em;}
.field input{
  width:100%;
  background:var(--s2);
  border:1px solid var(--bd2);
  border-radius:6px;
  padding:10px 12px;
  font-family:var(--mono);
  font-size:13px;
  color:var(--t1);
  outline:none;
  transition:border-color .15s;
}
.field input:focus{border-color:var(--amb);}
.field input::placeholder{color:var(--t3);}
.field-row{display:grid;grid-template-columns:1fr auto;align-items:center;margin-bottom:5px;}
.field-row label{margin-bottom:0;}
.field-link{font-size:12px;color:var(--amb);cursor:pointer;}

.checkbox-row{display:flex;align-items:center;gap:8px;margin-bottom:20px;}
.checkbox-row input[type=checkbox]{width:14px;height:14px;accent-color:var(--amb);}
.checkbox-row span{font-size:12.5px;color:var(--t2);}

.btn-amber{
  width:100%;
  padding:12px;
  background:var(--amb);
  color:#000;
  font-size:14px;
  font-weight:400;
  border:none;
  border-radius:6px;
  cursor:pointer;
  transition:opacity .15s;
  display:flex;align-items:center;justify-content:center;gap:8px;
  margin-bottom:16px;
}
.btn-amber:hover{opacity:.88;}
.btn-ghost-full{
  width:100%;
  padding:11px;
  background:var(--s2);
  color:var(--t2);
  font-size:13.5px;
  font-weight:400;
  border:1px solid var(--bd2);
  border-radius:6px;
  cursor:pointer;
  transition:all .15s;
  margin-bottom:8px;
}
.btn-ghost-full:hover{background:var(--s3);color:var(--t1);}
.auth-foot{text-align:center;font-size:12.5px;color:var(--t3);margin-top:8px;}
.auth-foot a{color:var(--amb);cursor:pointer;}

/* demo accounts */
.demo-box{
  margin-top:20px;
  background:var(--s2);
  border:1px solid var(--bd);
  border-radius:6px;
  overflow:hidden;
}
.demo-head{
  padding:8px 12px;
  font-family:var(--mono);
  font-size:10px;
  letter-spacing:.08em;
  color:var(--t3);
  border-bottom:1px solid var(--bd);
}
.demo-row{
  display:flex;
  align-items:center;
  padding:9px 12px;
  gap:10px;
  border-bottom:1px solid var(--bd);
  cursor:pointer;
  transition:background .12s;
}
.demo-row:last-child{border-bottom:none;}
.demo-row:hover{background:var(--s3);}
.demo-role{
  font-family:var(--mono);
  font-size:10.5px;
  font-weight:400;
  padding:2px 8px;
  border-radius:6px;
  background:var(--amb2);
  color:var(--amb);
  flex-shrink:0;
  min-width:60px;
  text-align:center;
}
.demo-email{font-family:var(--mono);font-size:11px;color:var(--t2);flex:1;}
.demo-copy{font-size:10.5px;color:var(--t3);}
.demo-note{padding:8px 12px;font-family:var(--mono);font-size:10px;color:var(--t3);}

/* role cards */
.role-cards{display:flex;flex-direction:column;gap:8px;margin-bottom:20px;}
.role-card{
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px;
  background:var(--s2);
  border:1.5px solid var(--bd);
  border-radius:6px;
  cursor:pointer;
  transition:all .15s;
}
.role-card:hover{border-color:var(--bd2);}
.role-card.sel{border-color:var(--amb);background:var(--amb2);}
.role-ico{
  width:34px;height:34px;
  border-radius:6px;
  background:var(--s3);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.role-card.sel .role-ico{background:rgba(237,232,216,.11);}
.role-name{font-size:13.5px;font-weight:400;}
.role-desc{font-size:11.5px;color:var(--t3);margin-top:1px;}
.role-check{margin-left:auto;flex-shrink:0;color:var(--amb);opacity:0;}
.role-card.sel .role-check{opacity:1;}

/* asset cards */
.asset-cards{display:flex;flex-direction:column;gap:6px;margin-bottom:20px;}
.asset-row{
  display:flex;align-items:center;gap:12px;
  padding:12px 14px;
  background:var(--s2);
  border:1.5px solid var(--bd);
  border-radius:6px;
  cursor:pointer;
  transition:all .15s;
}
.asset-row:hover{border-color:var(--bd2);}
.asset-row.sel{border-color:var(--amb);}
.asset-ico{width:28px;height:28px;border-radius:6px;background:var(--s3);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;color:var(--t2);flex-shrink:0;}
.asset-ico svg{color:inherit;stroke:currentColor;}
.asset-row.sel .asset-ico{color:var(--amb);background:var(--amb2);}
.asset-name{font-size:13px;font-weight:400;flex:1;}
.asset-sub{font-family:var(--mono);font-size:10.5px;color:var(--t3);}
.asset-chk{width:16px;height:16px;border-radius:6px;border:1.5px solid var(--bd2);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.asset-row.sel .asset-chk{background:var(--amb);border-color:var(--amb);}

/* risk cards */
.risk-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:20px;}
.risk-card{
  padding:12px 10px;text-align:center;
  background:var(--s2);border:1.5px solid var(--bd);border-radius:6px;cursor:pointer;transition:all .15s;
}
.risk-card:hover{border-color:var(--bd2);}
.risk-card.sel{border-color:var(--amb);}
.risk-name{font-size:12px;font-weight:400;margin-bottom:4px;}
.risk-desc{font-size:10.5px;color:var(--t3);line-height:1.4;}
.risk-card.sel .risk-desc{color:var(--amb);}

/* toggles */
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--bd);}
.toggle-row:last-child{border-bottom:none;}
.toggle-lbl{font-size:13px;color:var(--t2);}
.toggle-sw{width:36px;height:20px;border-radius:100px;background:var(--s3);border:none;cursor:pointer;position:relative;transition:background .15s;flex-shrink:0;}
.toggle-sw.on{background:var(--amb);}
.toggle-sw::after{content:'';position:absolute;width:14px;height:14px;border-radius:50%;background:rgba(237,232,216,.06);top:3px;left:3px;transition:transform .15s;}
.toggle-sw.on::after{transform:translateX(16px);}

/* setup complete */
.setup-done{text-align:center;padding:20px 0;}
.done-icon{
  width:56px;height:56px;border-radius:50%;background:var(--grn2);border:2px solid var(--grn);
  display:flex;align-items:center;justify-content:center;margin:0 auto 16px;
}
.setup-items{display:flex;flex-direction:column;gap:4px;margin:20px 0;}
.si{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 14px;background:var(--s2);border:1px solid var(--bd);border-radius:6px;cursor:pointer;
  transition:background .12s;
}
.si:hover{background:var(--s3);}
.si-l{display:flex;align-items:center;gap:10px;}
.si-ico{width:28px;height:28px;border-radius:6px;background:var(--s3);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.si-name{font-size:13px;font-weight:400;}
.si-sub{font-size:11px;color:var(--t3);}
.si-arr{color:var(--t3);}
.si.done-item .si-arr{color:var(--grn);}
.tos{text-align:center;font-size:11px;color:var(--t3);margin-top:12px;}
.tos a{color:var(--amb);}

/* ═══════════════════════════════════════════════
   DASHBOARD
═══════════════════════════════════════════════ */
#vDash{flex-direction:row;}

/* sidebar */
.dsb{
  width:200px;
  flex-shrink:0;
  border-right:1px solid var(--bd);
  display:flex;
  flex-direction:column;
  background:var(--s1);
  overflow:hidden;
}
.dsb-logo{
  padding:16px;
  border-bottom:1px solid var(--bd);
  display:flex;align-items:center;gap:8px;
  flex-shrink:0;
}
.dsb-logo-txt{font-size:14px;font-weight:400;letter-spacing:-.2px;}
.dsb-nav{flex:1;overflow-y:auto;padding:8px;scrollbar-width:none;}
.dsb-nav::-webkit-scrollbar{display:none;}
/* Pinned pipeline + dots — never scrolls */
.dsb-pin{
  flex-shrink:0;
  padding:8px 8px 6px;
  border-bottom:1px solid rgba(201,168,76,.08);
}
/* Override all global .npp size rules inside the sidebar pin */
.dsb-pin .nav-pipeline{
  padding:4px 2px 2px;
  gap:2px;
  border-bottom:none;
  margin-bottom:4px;
  flex-wrap:nowrap;
  overflow:hidden;
}
.dsb-pin .npp{
  font-size:8px !important;
  padding:2px 4px !important;
  letter-spacing:.05em !important;
  white-space:nowrap;
  border-width:1px;
}
.dsb-pin .npp-arr{
  font-size:7px;
  opacity:.3;
}
.dsb-pin .flow-progress{
  margin:5px 0 0 2px;
}
.dsb-sec{
  font-size:9.5px;
  font-weight:400;
  letter-spacing:.1em;
  text-transform:uppercase;
  color:var(--t3);
  padding:12px 8px 4px;
}
.nav-item{
  display:flex;align-items:center;gap:9px;
  padding:7px 8px;border-radius:6px;
  font-size:13px;font-weight:400;color:var(--t2);
  cursor:pointer;transition:all .12s;
  position:relative;
}
.nav-item:hover{background:var(--s2);color:var(--t1);}
.nav-item.on{background:var(--amb2);color:var(--amb);}
.nav-item svg{flex-shrink:0;opacity:.7;}
.nav-item.on svg{opacity:1;}
.nav-badge{
  margin-left:auto;
  background:var(--amb);
  color:#000;
  font-size:10px;
  font-weight:400;
  padding:1px 5px;
  border-radius:6px;
  min-width:18px;
  text-align:center;
}
.nav-badge.red{background:var(--red);color:var(--t1);}
.dsb-user{
  padding:12px;border-top:1px solid var(--bd);
  display:flex;align-items:center;gap:9px;cursor:pointer;
  transition:background .12s;flex-shrink:0;
}
.dsb-user:hover{background:var(--s2);}
.user-av{
  width:30px;height:30px;border-radius:50%;
  background:var(--amb2);
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:400;color:var(--amb);flex-shrink:0;
}
.user-name{font-size:12.5px;font-weight:400;}
.user-role{font-size:10.5px;color:var(--t3);}
.user-out{margin-left:auto;color:var(--t3);}

/* main */
.dmain{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;}

/* top bar */
.dtop{
  height:50px;border-bottom:1px solid var(--bd);
  display:flex;align-items:center;padding:0 24px;flex-shrink:0;gap:12px;
}
.dtop-label{
  font-family:var(--mono);font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--t3);
}
.dtop-title{font-size:14px;font-weight:400;color:var(--t1);}
.dtop-r{margin-left:auto;display:flex;align-items:center;gap:10px;}
.live-badge{display:flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10.5px;color:var(--t3);}
.live-dot{width:5px;height:5px;border-radius:50%;background:var(--grn);animation:lpulse 2.4s ease-in-out infinite;}
@keyframes lpulse{0%,100%{opacity:.4;}50%{opacity:1;}}
@keyframes ambPulse{0%{box-shadow:0 0 0 0 rgba(201,168,76,.7);opacity:1;}70%{box-shadow:0 0 0 5px rgba(201,168,76,0);opacity:.75;}100%{box-shadow:0 0 0 0 rgba(201,168,76,0);opacity:1;}}
.sess-pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px 3px 7px;border-radius:20px;border:1px solid rgba(237,232,216,.1);background:rgba(237,232,216,.03);white-space:nowrap;transition:all .15s;}
.sess-pill.open{border-color:rgba(201,168,76,.38);background:rgba(201,168,76,.07);}
.sess-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;background:rgba(237,232,216,.2);}
.sess-dot.open{background:#c9a84c;animation:ambPulse 1.8s ease-out infinite;}
.sess-name{font-size:10.5px;font-weight:600;letter-spacing:.02em;}
.sess-pill.open .sess-name{color:#c9a84c;}
.sess-pill:not(.open) .sess-name{color:rgba(237,232,216,.32);}
.sess-status{font-size:9px;font-family:var(--mono);}
.sess-pill.open .sess-status{color:rgba(201,168,76,.55);}
.sess-pill:not(.open) .sess-status{color:rgba(237,232,216,.18);}
.btn-view-sig{
  display:flex;align-items:center;gap:6px;
  padding:7px 14px;background:rgba(237,232,216,.07);color:rgba(237,232,216,.88);border:1px solid rgba(237,232,216,.44);
  font-size:12.5px;font-weight:400;border:none;border-radius:6px;cursor:pointer;
  transition:opacity .14s;
}
.btn-view-sig:hover{opacity:.85;}

/* content */
.dcontent{flex:1;min-height:0;overflow-y:auto;padding:24px;scrollbar-width:thin;scrollbar-color:var(--s3) transparent;}

/* greeting */
.greet{margin-bottom:20px;}
.greet h2{font-size:22px;font-weight:400;letter-spacing:-.02em;margin-bottom:3px;}
.greet p{font-size:13px;color:var(--t2);}
.greet em{font-style:normal;color:var(--amb);}

/* metric cards */
.metrics-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:10px;}
.metrics-grid2{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px;}
.mc{
  background:var(--s1);border:1px solid var(--bd);border-radius:6px;padding:14px 16px;
}
.mc-label{font-size:10.5px;font-weight:400;letter-spacing:.05em;text-transform:uppercase;color:var(--t3);margin-bottom:8px;}
.mc-val{font-size:22px;font-weight:400;letter-spacing:-.02em;line-height:1;}
.mc-val.grn{color:var(--grn);}
.mc-val.red{color:var(--red);}
.mc-sub{font-size:11px;color:var(--t3);margin-top:5px;display:flex;align-items:center;gap:4px;}
.mc-sub .up{color:var(--grn);}
.mc-sub .dn{color:var(--red);}
.mc-spark{margin-top:8px;display:block;}

/* main content grid */
.dash-grid{display:grid;grid-template-columns:1fr 300px;gap:12px;margin-bottom:12px;}

/* chart card */
.chart-card{
  background:var(--s1);border:1px solid var(--bd);border-radius:6px;overflow:hidden;
}
.cc-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px;border-bottom:1px solid var(--bd);
}
.cc-title{font-size:12.5px;font-weight:400;}
.cc-sub{font-size:11px;color:var(--t3);}
.cc-tabs{display:flex;gap:2px;}
.cctab{
  padding:3px 9px;border-radius:6px;font-size:11px;font-weight:400;
  color:var(--t3);cursor:pointer;transition:all .12s;
}
.cctab.on{background:rgba(237,232,216,.07);color:rgba(237,232,216,.88);border:1px solid rgba(237,232,216,.44);}
.chart-legend{
  display:flex;gap:14px;padding:0 16px 10px;
}
.cl-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--t2);}
.cl-line{width:16px;height:2px;border-radius:6px;}
#pnlChart{width:100%;height:160px;display:block;}

/* alerts card */
.alerts-card{
  background:var(--s1);border:1px solid var(--bd);border-radius:6px;overflow:hidden;display:flex;flex-direction:column;
}
.ac-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 14px;border-bottom:1px solid var(--bd);flex-shrink:0;
}
.ac-title{font-size:12.5px;font-weight:400;}
.ac-all{font-size:11.5px;color:var(--amb);cursor:pointer;}
.alerts-scroll{overflow-y:auto;flex:1;scrollbar-width:thin;scrollbar-color:var(--s3) transparent;}
.alert-item{
  padding:10px 14px;border-bottom:1px solid var(--bd);
  display:flex;flex-direction:column;gap:3px;
}
.alert-item:last-child{border-bottom:none;}
.ai-top{display:flex;align-items:center;gap:7px;}
.ai-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.ai-dot.warn{background:var(--amb);}
.ai-dot.info{background:var(--amb);}
.ai-dot.success{background:var(--grn);}
.ai-sym{font-family:var(--mono);font-size:11.5px;font-weight:400;}
.ai-time{font-size:10.5px;color:var(--t3);margin-left:auto;}
.ai-msg{font-size:12px;color:var(--t2);line-height:1.5;padding-left:14px;}
.ai-ack{font-size:11.5px;color:var(--amb);cursor:pointer;padding-left:14px;margin-top:2px;}

/* bottom row */
.bottom-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:12px;}

/* positions */
.positions-card{
  background:var(--s1);border:1px solid var(--bd);border-radius:6px;overflow:hidden;
}
.pos-head{
  display:flex;align-items:center;gap:10px;
  padding:12px 16px;border-bottom:1px solid var(--bd);
}
.pos-title{font-size:12.5px;font-weight:400;}
.pos-sub{font-size:11px;color:var(--t3);}
.pos-table-wrap{overflow-x:auto;scrollbar-width:thin;scrollbar-color:var(--s3) transparent;}
.pos-table{width:100%;border-collapse:collapse;font-size:12px;}
.pos-table th{
  text-align:left;padding:8px 12px;
  font-size:10px;font-weight:400;letter-spacing:.06em;text-transform:uppercase;color:var(--t3);
  border-bottom:1px solid var(--bd);
  white-space:nowrap;
}
.pos-table td{padding:9px 12px;border-bottom:1px solid var(--bd);vertical-align:middle;white-space:nowrap;}
.pos-table tr:last-child td{border-bottom:none;}
.pos-table tr:hover td{background:rgba(255,255,255,.02);}
.sym-dot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:6px;}
.sym-dot.open{background:var(--grn);}
.sym-dot.partial{background:var(--amb);}
.cls-badge{font-family:var(--mono);font-size:10px;font-weight:400;padding:1px 7px;border-radius:6px;}
.cls-badge.options{background:rgba(96,165,250,.1);color:#60a5fa;}
.cls-badge.crypto{background:rgba(237,232,216,.06);color:var(--amb);}
.cls-badge.equity{background:rgba(98,242,157,.1);color:var(--grn);}
.dir-badge{font-family:var(--mono);font-size:10px;font-weight:400;padding:1px 7px;border-radius:6px;}
.dir-badge.long{background:rgba(98,242,157,.1);color:var(--grn);}
.dir-badge.short{background:rgba(240,112,112,.1);color:var(--red);}
.pnl-pos{color:var(--grn);}
.pnl-neg{color:var(--red);}
.sts-badge{font-family:var(--mono);font-size:10px;font-weight:400;padding:1px 7px;border-radius:6px;}
.sts-badge.open{background:rgba(98,242,157,.1);color:var(--grn);}
.sts-badge.partial{background:rgba(237,232,216,.06);color:var(--amb);}

/* signal activity */
.sig-act-card{background:var(--s1);border:1px solid var(--bd);border-radius:6px;overflow:hidden;}
.sa-head{padding:12px 14px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;}
.sa-title{font-size:12.5px;font-weight:400;}
.sa-day{font-size:11px;color:var(--t3);}
.sa-scroll{overflow-y:auto;max-height:180px;scrollbar-width:thin;scrollbar-color:var(--s3) transparent;}
.sa-item{display:flex;align-items:flex-start;gap:8px;padding:9px 14px;border-bottom:1px solid var(--bd);}
.sa-item:last-child{border-bottom:none;}
.sa-dot{width:6px;height:6px;border-radius:50%;margin-top:5px;flex-shrink:0;}
.sa-dot.buy{background:var(--grn);}
.sa-dot.sell{background:var(--red);}
.sa-dot.info{background:var(--amb);}
.sa-body{flex:1;}
.sa-text{font-size:12px;color:var(--t2);line-height:1.4;}
.sa-text strong{color:var(--t1);font-weight:400;}
.sa-time{font-size:10.5px;color:var(--t3);margin-top:1px;}

/* scrollbar */
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--s3);border-radius:6px;}

/* ═══════════════════════════════════════════════
   SETTINGS — two-panel layout
═══════════════════════════════════════════════ */
.sett-outer{display:flex;flex-direction:column;min-height:600px;}
.sett-hd{display:flex;align-items:center;gap:14px;padding:18px 24px 16px;border-bottom:1px solid var(--bd);flex-shrink:0;}
.sett-hd-ico{width:40px;height:40px;border-radius:6px;background:var(--amb2);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.sett-hd-title{font-size:18px;font-weight:400;letter-spacing:-.02em;}
.sett-hd-sub{font-family:var(--mono);font-size:11.5px;color:var(--t3);margin-top:3px;}
.sett-body{display:flex;flex:1;align-items:flex-start;}
.sett-snav{width:200px;flex-shrink:0;border-right:1px solid var(--bd);padding:10px 8px;position:sticky;top:0;max-height:calc(100vh - 120px);overflow-y:auto;}
.sett-snav-item{padding:9px 12px;border-radius:6px;font-size:13px;font-weight:400;color:var(--t2);cursor:pointer;transition:all .12s;margin-bottom:2px;}
.sett-snav-item:hover{background:var(--s2);color:var(--t1);}
.sett-snav-item.on{background:rgba(237,232,216,.07);color:rgba(237,232,216,.88);border:1px solid rgba(237,232,216,.44);font-weight:400;}
.sett-panel{flex:1;padding:24px 28px;}
.sett-save-row{display:flex;justify-content:flex-end;padding-top:16px;}
.sett-save-btn{display:flex;align-items:center;gap:7px;padding:10px 24px;background:rgba(237,232,216,.07);color:rgba(237,232,216,.88);border:1px solid rgba(237,232,216,.44);font-size:13.5px;font-weight:400;border:none;border-radius:6px;cursor:pointer;transition:opacity .14s;box-shadow:0 4px 16px rgba(237,232,216,.20);}
.sett-save-btn:hover{opacity:.88;}
.sett-sect{background:var(--s1);border:1px solid var(--bd);border-radius:6px;padding:20px;margin-bottom:14px;}
.sett-sect-title{font-size:14px;font-weight:400;margin-bottom:4px;}
.sett-sect-sub{font-family:var(--mono);font-size:11.5px;color:var(--t2);margin-bottom:18px;line-height:1.5;}
/* asset prefs */
.ap-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.ap-card{display:flex;align-items:flex-start;gap:14px;padding:16px;background:var(--s2);border:1.5px solid var(--bd);border-radius:6px;cursor:pointer;transition:all .15s;position:relative;}
.ap-card:hover{border-color:var(--bd2);}
.ap-card.sel{border-color:var(--amb);}
.ap-ico{width:36px;height:36px;border-radius:6px;background:var(--s3);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.ap-card.sel .ap-ico{background:rgba(237,232,216,.10);}
.ap-body{flex:1;min-width:0;}
.ap-name{font-size:13.5px;font-weight:400;margin-bottom:2px;padding-right:22px;}
.ap-sym{font-family:var(--mono);font-size:11px;color:var(--amb);margin-bottom:3px;}
.ap-desc{font-size:11px;color:var(--t3);line-height:1.4;}
.ap-chk{position:absolute;top:12px;right:12px;width:18px;height:18px;border-radius:6px;border:1.5px solid var(--bd2);background:var(--s3);display:flex;align-items:center;justify-content:center;transition:all .15s;}
.ap-card.sel .ap-chk{background:var(--amb);border-color:var(--amb);}
.ap-status{padding:10px 14px;border:1px solid var(--amb);border-radius:6px;font-family:var(--mono);font-size:12px;color:var(--amb);}
/* risk tolerance */
.rt-card{display:flex;align-items:flex-start;gap:14px;padding:16px;background:var(--s2);border:1.5px solid var(--bd);border-radius:6px;cursor:pointer;transition:all .15s;position:relative;margin-bottom:10px;}
.rt-card:last-child{margin-bottom:0;}
.rt-card:hover{border-color:var(--bd2);}
.rt-card.sel{border-color:var(--amb);}
.rt-ico{width:34px;height:34px;border-radius:6px;background:var(--s3);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.rt-card.sel .rt-ico{background:rgba(237,232,216,.10);}
.rt-body{flex:1;}
.rt-row1{display:flex;align-items:center;gap:8px;margin-bottom:4px;}
.rt-name{font-size:13.5px;font-weight:400;}
.rt-tag{font-family:var(--mono);font-size:10px;font-weight:400;padding:2px 8px;border-radius:6px;background:rgba(255,255,255,.04);color:var(--t3);}
.rt-card.sel .rt-tag{background:rgba(237,232,216,.10);color:var(--amb);}
.rt-desc{font-family:var(--mono);font-size:11px;color:var(--t3);line-height:1.45;margin-bottom:10px;}
.rt-stats{display:flex;gap:24px;}
.rt-stat-lbl{font-size:10px;color:var(--t3);margin-bottom:2px;}
.rt-stat-val{font-family:var(--mono);font-size:13px;font-weight:400;color:var(--t2);}
.rt-card.sel .rt-stat-val{color:var(--amb);}
.rt-radio{position:absolute;top:14px;right:14px;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--bd2);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.rt-card.sel .rt-radio{border-color:var(--amb);}
.rt-radio::after{content:'';width:8px;height:8px;border-radius:50%;background:var(--amb);opacity:0;transition:opacity .15s;}
.rt-card.sel .rt-radio::after{opacity:1;}
.rt-status{padding:10px 14px;border:1px solid rgba(237,232,216,.20);border-radius:6px;font-family:var(--mono);font-size:12px;color:var(--amb);background:rgba(237,232,216,.04);}
/* perf goals */
.pg-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:0;}
.pg-card{background:var(--s2);border:1px solid var(--bd);border-radius:6px;padding:16px;}
.pg-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:3px;}
.pg-name{font-size:13px;font-weight:400;}
.pg-val{font-family:var(--mono);font-size:20px;font-weight:400;}
.pg-sub{font-family:var(--mono);font-size:10.5px;color:var(--t3);margin-bottom:12px;}
.pg-track{position:relative;height:5px;border-radius:6px;margin-bottom:5px;}
.pg-fill{position:absolute;left:0;top:0;height:100%;border-radius:6px;pointer-events:none;}
.pg-range{position:absolute;top:50%;transform:translateY(-50%);width:100%;-webkit-appearance:none;appearance:none;background:transparent;cursor:pointer;height:20px;margin:0;}
.pg-range::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;border:2px solid var(--bg);}
.pg-range.grn::-webkit-slider-thumb{background:var(--grn);}
.pg-range.amb::-webkit-slider-thumb{background:var(--amb);}
.pg-range.blue::-webkit-slider-thumb{background:#60a5fa;}
.pg-range.purple::-webkit-slider-thumb{background:#a78bfa;}
.pg-marks{display:flex;justify-content:space-between;}
.pg-mark{font-family:var(--mono);font-size:10px;color:var(--t3);}
.exp-box{display:grid;grid-template-columns:repeat(4,1fr);background:var(--s2);border:1px solid var(--bd);border-radius:6px;padding:14px 18px;gap:12px;}
.exp-lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--t3);margin-bottom:6px;}
.exp-val{font-family:var(--mono);font-size:22px;font-weight:400;}
.exp-val.grn{color:var(--grn);}
.exp-val.red{color:var(--red);}
.exp-val.amb{color:var(--amb);}
.bench-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.bench-card{background:var(--s2);border:1.5px solid var(--bd);border-radius:6px;padding:12px 14px;cursor:pointer;transition:all .15s;}
.bench-card:hover{border-color:var(--bd2);}
.bench-card.sel{border-color:var(--amb);}
.bench-name{font-size:13px;font-weight:400;margin-bottom:3px;}
.bench-desc{font-size:11px;color:var(--t3);margin-bottom:5px;}
.bench-ytd{font-family:var(--mono);font-size:12px;font-weight:400;color:var(--grn);}
.bench-ytd.dim{color:var(--t3);}
.cad-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.cad-card{background:var(--s2);border:1.5px solid var(--bd);border-radius:6px;padding:12px 14px;cursor:pointer;transition:all .15s;}
.cad-card:hover{border-color:var(--bd2);}
.cad-card.sel{border-color:var(--amb);}
.cad-name{font-size:13px;font-weight:400;margin-bottom:3px;display:flex;align-items:center;gap:5px;}
.cad-sub{font-size:11px;color:var(--t3);}
/* portfolio */
.pa-wrap{display:flex;gap:20px;align-items:flex-start;}
.pa-donut{flex-shrink:0;}
.pa-rows{flex:1;}
.pa-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--bd);}
.pa-row:last-child{border-bottom:none;}
.pa-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.pa-name{font-size:13px;flex:1;}
.pa-val{font-family:var(--mono);font-size:13px;font-weight:400;color:var(--t2);min-width:32px;text-align:right;}
.pa-btn{width:22px;height:22px;border-radius:6px;background:var(--s3);border:1px solid var(--bd2);color:var(--t2);font-size:14px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .12s;flex-shrink:0;}
.pa-btn:hover{background:var(--s2);color:var(--t1);}
.psm-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.psm-card{background:var(--s2);border:1.5px solid var(--bd);border-radius:6px;padding:14px;cursor:pointer;transition:all .15s;}
.psm-card:hover{border-color:var(--bd2);}
.psm-card.sel{border-color:var(--amb);}
.psm-head{display:flex;align-items:center;gap:7px;margin-bottom:5px;}
.psm-name{font-size:13px;font-weight:400;}
.psm-tag{font-family:var(--mono);font-size:10px;font-weight:400;padding:1px 8px;border-radius:6px;}
.psm-tag.simple{background:rgba(96,165,250,.12);color:#60a5fa;}
.psm-tag.optimal{background:rgba(98,242,157,.12);color:var(--grn);}
.psm-tag.recommended{background:rgba(237,232,216,.08);color:var(--amb);}
.psm-tag.advanced{background:rgba(167,139,250,.12);color:#a78bfa;}
.psm-desc{font-size:11.5px;color:var(--t3);line-height:1.4;}
.prc-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.prc-card{background:var(--s2);border:1px solid var(--bd);border-radius:6px;padding:14px;}
.prc-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:4px;}
.prc-name{font-size:13px;font-weight:400;}
.prc-val{font-family:var(--mono);font-size:15px;font-weight:400;color:var(--amb);}
.prc-desc{font-family:var(--mono);font-size:10.5px;color:var(--t3);margin-bottom:10px;line-height:1.4;}
.prc-track{position:relative;height:5px;background:var(--s3);border-radius:6px;margin-bottom:4px;}
.prc-fill{position:absolute;left:0;top:0;height:100%;border-radius:6px;pointer-events:none;}
.prc-range{position:absolute;top:50%;transform:translateY(-50%);width:100%;-webkit-appearance:none;appearance:none;background:transparent;cursor:pointer;height:20px;margin:0;}
.prc-range.blue::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--amb);border:2px solid var(--bg);}
.prc-range.red::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--red);border:2px solid var(--bg);}
.prc-marks{display:flex;justify-content:space-between;}
.prc-mark{font-family:var(--mono);font-size:10px;color:var(--t3);}
.reb-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.reb-card{background:var(--s2);border:1.5px solid var(--bd);border-radius:6px;padding:12px 14px;cursor:pointer;transition:all .15s;}
.reb-card:hover{border-color:var(--bd2);}
.reb-card.sel{border-color:var(--amb);}
.reb-name{font-size:12.5px;font-weight:400;margin-bottom:3px;}
.reb-sub{font-size:11px;color:var(--t3);line-height:1.4;}
/* alert thresholds */
.at-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:0;}
.at-card{background:var(--s2);border:1px solid var(--bd);border-radius:6px;padding:16px;}
.at-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px;}
.at-name{font-size:13px;font-weight:400;}
.at-val{font-family:var(--mono);font-size:20px;font-weight:400;}
.at-val.amb{color:var(--amb);}
.at-val.blue{color:var(--amb);}
.at-val.red{color:var(--red);}
.at-sub{font-family:var(--mono);font-size:10.5px;color:var(--t3);margin-bottom:12px;line-height:1.4;}
.at-track{position:relative;height:5px;border-radius:6px;margin-bottom:4px;}
.at-fill{position:absolute;left:0;top:0;height:100%;border-radius:6px;pointer-events:none;}
.at-range{position:absolute;top:50%;transform:translateY(-50%);width:100%;-webkit-appearance:none;appearance:none;background:transparent;cursor:pointer;height:20px;margin:0;}
.at-range.amb::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--amb);border:2px solid var(--bg);}
.at-range.blue::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--amb);border:2px solid var(--bg);}
.at-range.red::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--red);border:2px solid var(--bg);}
.at-marks{display:flex;justify-content:space-between;margin-top:3px;}
.at-mark{font-family:var(--mono);font-size:10px;color:var(--t3);}
.nc-wrap{background:var(--s1);border:1px solid var(--bd);border-radius:6px;overflow:hidden;}
.nc-row{display:flex;align-items:center;gap:14px;padding:14px 16px;border-bottom:1px solid var(--bd);}
.nc-row:last-child{border-bottom:none;}
.nc-ico{width:34px;height:34px;border-radius:6px;background:var(--s2);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.nc-body{flex:1;}
.nc-name{font-size:13.5px;font-weight:400;margin-bottom:2px;}
.nc-sub{font-family:var(--mono);font-size:11px;color:var(--t3);}
/* timezone */
.tz-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
.tz-card{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--s2);border:1.5px solid var(--bd);border-radius:6px;cursor:pointer;transition:all .15s;position:relative;}
.tz-card:hover{border-color:var(--bd2);}
.tz-card.sel{border-color:var(--amb);}
.tz-globe{color:var(--t3);flex-shrink:0;transition:color .15s;}
.tz-card.sel .tz-globe{color:var(--amb);}
.tz-body{flex:1;}
.tz-city{font-size:13px;font-weight:400;margin-bottom:2px;}
.tz-info{font-family:var(--mono);font-size:10.5px;color:var(--t3);}
.tz-card.sel .tz-info{color:rgba(237,232,216,.62);}
.tz-dot{width:7px;height:7px;border-radius:50%;background:var(--amb);opacity:0;transition:opacity .15s;flex-shrink:0;}
.tz-card.sel .tz-dot{opacity:1;}
.tz-active-bar{display:flex;align-items:center;gap:8px;padding:10px 14px;border:1px solid rgba(237,232,216,.20);border-radius:6px;font-family:var(--mono);font-size:12px;color:var(--amb);background:rgba(237,232,216,.04);}
.ath-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:0;}
.ath-label{font-size:12px;font-weight:400;color:var(--t2);margin-bottom:5px;}
.ath-input{width:100%;background:var(--s2);border:1px solid var(--bd2);border-radius:6px;padding:11px 14px;font-family:var(--mono);font-size:14px;color:var(--t1);outline:none;transition:border-color .15s;}
.ath-input:focus{border-color:var(--amb);}
.gms-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--bd);}
.gms-row:last-child{border-bottom:none;}
.gms-name{font-size:13px;font-weight:400;}
.gms-grn{color:var(--grn);}
.gms-blue{color:var(--amb);}
.gms-amb{color:var(--amb);}
.gms-hours{font-family:var(--mono);font-size:12px;color:var(--t3);}
.sett-header{margin-bottom:20px;}
.sett-subnav{
  display:flex;gap:2px;
  background:var(--s2);border:1px solid var(--bd);border-radius:6px;
  padding:4px;margin-bottom:28px;
}
.sett-tab{
  flex:1;padding:9px 10px;text-align:center;
  font-size:12.5px;font-weight:400;color:var(--t2);
  border-radius:6px;cursor:pointer;transition:all .15s;white-space:nowrap;
}
.sett-tab:hover{color:var(--t1);}
.sett-tab.on{background:var(--s1);color:var(--t1);box-shadow:0 1px 4px rgba(0,0,0,.35);}
.sett-sec-title{font-size:13px;font-weight:400;color:var(--t1);margin-bottom:4px;}
.sett-sec-sub{font-size:12px;color:var(--t2);margin-bottom:18px;line-height:1.5;}

/* asset preference grid */
.ap-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px;}
.ap-card{
  background:var(--s1);border:1.5px solid var(--bd);border-radius:6px;
  padding:16px 14px 14px;cursor:pointer;transition:all .15s;position:relative;
}
.ap-card:hover{border-color:var(--bd2);}
.ap-card.sel{border-color:var(--amb);}
.ap-chk{
  position:absolute;top:12px;right:12px;
  width:17px;height:17px;border-radius:6px;
  border:1.5px solid var(--bd2);
  background:var(--s2);
  display:flex;align-items:center;justify-content:center;
  transition:all .15s;flex-shrink:0;
}
.ap-card.sel .ap-chk{background:var(--amb);border-color:var(--amb);}
.ap-ico{
  width:34px;height:34px;border-radius:6px;
  background:var(--s3);display:flex;align-items:center;justify-content:center;
  margin-bottom:10px;
}
.ap-card.sel .ap-ico{background:rgba(237,232,216,.10);}
.ap-name{font-size:12.5px;font-weight:400;margin-bottom:3px;padding-right:20px;}
.ap-sub{font-size:10.5px;color:var(--t3);line-height:1.4;}
.sett-status-bar{
  display:flex;align-items:center;justify-content:space-between;
  padding:11px 16px;background:var(--s2);border:1px solid var(--bd);border-radius:6px;
  margin-top:4px;
}
.ssb-left{display:flex;align-items:center;gap:6px;}
.ssb-count{font-family:var(--mono);font-size:13px;font-weight:400;color:var(--amb);}
.ssb-label{font-size:12px;color:var(--t3);}
.sett-save{
  padding:8px 20px;background:rgba(237,232,216,.07);color:rgba(237,232,216,.88);border:1px solid rgba(237,232,216,.44);
  font-size:12.5px;font-weight:400;border:none;border-radius:6px;cursor:pointer;transition:opacity .14s;
}
.sett-save:hover{opacity:.85;}

/* risk tolerance cards */
.rt-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px;}
.rt-card{
  background:var(--s1);border:1.5px solid var(--bd);border-radius:6px;
  padding:16px;cursor:pointer;transition:all .15s;
}
.rt-card:hover{border-color:var(--bd2);}
.rt-card.sel{border-color:var(--amb);background:rgba(237,232,216,.04);}
.rt-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.rt-name{font-size:13.5px;font-weight:400;}
.rt-radio{
  width:18px;height:18px;border-radius:50%;border:1.5px solid var(--bd2);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;
}
.rt-card.sel .rt-radio{border-color:var(--amb);}
.rt-radio-dot{width:8px;height:8px;border-radius:50%;background:var(--amb);opacity:0;transition:opacity .15s;}
.rt-card.sel .rt-radio-dot{opacity:1;}
.rt-stats{display:flex;flex-direction:column;gap:6px;}
.rt-stat{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;background:var(--s2);border-radius:6px;}
.rt-sl{font-size:10.5px;color:var(--t3);}
.rt-sv{font-family:var(--mono);font-size:12px;font-weight:400;}
.rt-sv.grn{color:var(--grn);}
.rt-sv.red{color:var(--red);}
.rt-sv.amb{color:var(--amb);}
.rt-status{
  padding:11px 14px;background:rgba(237,232,216,.05);
  border:1px solid rgba(237,232,216,.15);border-radius:6px;
  font-size:12px;color:var(--amb);display:flex;align-items:flex-start;gap:8px;margin-bottom:16px;
  line-height:1.5;
}

/* alert sliders */
.sl-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:24px;}
.sl-card{background:var(--s1);border:1px solid var(--bd);border-radius:6px;padding:16px;}
.sl-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px;}
.sl-name{font-size:12.5px;font-weight:400;}
.sl-val{font-family:var(--mono);font-size:22px;font-weight:400;color:var(--amb);}
.sl-track{position:relative;height:5px;background:var(--s3);border-radius:6px;margin-bottom:6px;}
.sl-fill{position:absolute;left:0;top:0;height:100%;background:linear-gradient(to right,rgba(237,232,216,.44),var(--amb));border-radius:6px;pointer-events:none;}
.sl-range{
  position:absolute;top:50%;left:0;width:100%;transform:translateY(-50%);
  -webkit-appearance:none;appearance:none;
  background:transparent;cursor:pointer;height:20px;margin:0;
}
.sl-range::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--amb);border:2px solid #000;box-shadow:0 0 0 3px rgba(237,232,216,.16);}
.sl-range::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--amb);border:2px solid #000;}
.sl-marks{display:flex;justify-content:space-between;margin-top:4px;}
.sl-mark{font-size:10px;color:var(--t3);}

/* notification channels */
.sett-ch-grid{background:var(--s1);border:1px solid var(--bd);border-radius:6px;overflow:hidden;}
.sett-ch-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:13px 16px;border-bottom:1px solid var(--bd);
}
.sett-ch-row:last-child{border-bottom:none;}
.sett-ch-l{display:flex;align-items:center;gap:12px;}
.sett-ch-ico{width:32px;height:32px;border-radius:6px;background:var(--s2);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.sett-ch-name{font-size:13px;font-weight:400;}
.sett-ch-sub{font-size:11px;color:var(--t3);margin-top:1px;}

/* timezone */
.tz-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:24px;}
.tz-item{
  display:flex;align-items:center;gap:10px;
  padding:11px 14px;background:var(--s1);border:1.5px solid var(--bd);border-radius:6px;
  cursor:pointer;transition:all .15s;
}
.tz-item:hover{border-color:var(--bd2);}
.tz-item.sel{border-color:var(--amb);background:rgba(237,232,216,.04);}
.tz-abbr{
  font-family:var(--mono);font-size:9.5px;font-weight:400;letter-spacing:.04em;
  padding:2px 6px;border-radius:6px;background:var(--s3);color:var(--t3);flex-shrink:0;
  min-width:32px;text-align:center;
}
.tz-item.sel .tz-abbr{background:rgba(237,232,216,.11);color:var(--amb);}
.tz-city{font-size:13px;font-weight:400;flex:1;}
.tz-offset{font-family:var(--mono);font-size:10.5px;color:var(--t3);}
.tz-clock{font-family:var(--mono);font-size:11.5px;color:var(--t2);}
.tz-item.sel .tz-clock{color:var(--amb);}
.th-card{background:var(--s1);border:1px solid var(--bd);border-radius:6px;padding:16px;margin-bottom:16px;}
.th-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--bd);}
.th-row:last-child{border-bottom:none;}
.th-lbl{font-size:13px;color:var(--t2);}
.th-inp{
  background:var(--s2);border:1px solid var(--bd2);border-radius:6px;
  padding:7px 12px;font-family:var(--mono);font-size:13px;color:var(--t1);
  outline:none;width:120px;transition:border-color .15s;
}
.th-inp:focus{border-color:var(--amb);}
.ms-card{background:var(--s1);border:1px solid var(--bd);border-radius:6px;overflow:hidden;}
.ms-row{display:flex;align-items:center;justify-content:space-between;padding:11px 16px;border-bottom:1px solid var(--bd);}
.ms-row:last-child{border-bottom:none;}
.ms-name{font-size:12.5px;font-weight:400;}
.ms-hours{font-family:var(--mono);font-size:11px;color:var(--t3);}
.ms-badge{font-family:var(--mono);font-size:10px;font-weight:400;padding:2px 9px;border-radius:6px;}
.ms-badge.open{background:rgba(98,242,157,.12);color:var(--grn);}
.ms-badge.closed{background:rgba(255,255,255,.03);color:var(--t3);}

/* sidebar collapse */
.dsb-btn-collapse{
  display:flex;align-items:center;justify-content:center;gap:5px;
  width:calc(100% - 16px);margin:0 8px 6px;padding:6px 8px;
  border:1px solid var(--bd);border-radius:6px;background:transparent;
  color:var(--t3);font-size:11px;cursor:pointer;transition:all .15s;
}
.dsb-btn-collapse:hover{background:var(--s2);color:var(--t2);}
.dsb.collapsed{width:52px;}
.dsb.collapsed .dsb-coll-lbl,.dsb.collapsed .dsb-logo-txt,.dsb.collapsed .dsb-sec,
.dsb.collapsed .nav-item > span,.dsb.collapsed .nav-badge,
.dsb.collapsed .user-name,.dsb.collapsed .user-role,.dsb.collapsed .user-out{display:none;}
.dsb.collapsed .nav-item{justify-content:center;padding:7px;}
.dsb.collapsed .dsb-user{justify-content:center;}
.dsb.collapsed .dsb-btn-collapse{width:36px;padding:6px;margin:0 8px 6px;}

/* ═══════════════════════════════════════════════
   SIGNAL FEED
═══════════════════════════════════════════════ */
.sf-page-head{margin-bottom:18px;}
.sf-page-title{font-size:22px;font-weight:400;letter-spacing:-.02em;margin-bottom:4px;}
.sf-breadcrumb{font-family:var(--mono);font-size:10.5px;color:var(--t3);letter-spacing:.06em;}
.sf-breadcrumb em{font-style:normal;color:var(--amb);}
.sf-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px;}
.sf-mc{background:var(--s1);border:1px solid var(--bd);border-radius:6px;padding:14px 16px;display:flex;align-items:center;gap:12px;position:relative;transition:border-color .15s,background .15s;user-select:none;}
.sf-mc:hover{border-color:rgba(201,168,76,.3);background:rgba(201,168,76,.04);cursor:pointer;}
.sf-mc.expanded{border-color:rgba(201,168,76,.45);background:rgba(201,168,76,.06);border-bottom-left-radius:0;border-bottom-right-radius:0;}
.sf-mc-ico{width:38px;height:38px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.sf-mc-r{flex:1;}
.sf-mc-val{font-size:24px;font-weight:400;letter-spacing:-.02em;line-height:1;}
.sf-mc-lbl{font-size:10.5px;font-weight:400;letter-spacing:.05em;text-transform:uppercase;color:var(--t3);margin-bottom:6px;}
.sf-mc-sub{font-size:11px;color:var(--t3);margin-top:2px;}
.sf-toolbar{background:var(--s1);border:1px solid var(--bd);border-radius:6px;padding:12px 14px;margin-bottom:16px;}
.sf-search-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.sf-search-wrap{position:relative;flex:1;}
.sf-search-ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--t3);}
.sf-search{width:100%;background:var(--s2);border:1px solid var(--bd2);border-radius:6px;padding:9px 12px 9px 36px;font-size:13px;color:var(--t1);outline:none;transition:border-color .15s;}
.sf-search:focus{border-color:rgba(237,232,216,.44);}
.sf-search::placeholder{color:var(--t3);}
.sf-sort-wrap{position:relative;flex-shrink:0;}
.sf-sort-btn{display:flex;align-items:center;gap:6px;padding:9px 12px;background:var(--s2);border:1px solid var(--bd2);border-radius:6px;font-size:12.5px;color:var(--t2);cursor:pointer;transition:all .15s;white-space:nowrap;}
.sf-sort-btn:hover{color:var(--t1);}
.sf-sort-dd{position:absolute;right:0;top:calc(100% + 4px);z-index:200;background:var(--s2);border:1px solid var(--bd2);border-radius:6px;min-width:170px;overflow:hidden;display:none;box-shadow:0 8px 24px rgba(0,0,0,.5);}
.sf-sort-dd.open{display:block;}
.sf-sort-opt{display:flex;align-items:center;gap:10px;padding:9px 12px;font-size:12.5px;cursor:pointer;transition:background .12s;}
.sf-sort-opt:hover{background:var(--s3);}
.sf-sort-opt.on{color:var(--amb);}
.sf-filter-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.sf-filter-lbl{font-size:11px;font-weight:400;letter-spacing:.03em;color:var(--t3);flex-shrink:0;white-space:nowrap;}
.sf-pills{display:flex;gap:4px;flex-wrap:wrap;}
.sfp{padding:4px 11px;border-radius:6px;border:1px solid var(--bd2);font-size:11.5px;font-weight:400;color:var(--t2);background:transparent;cursor:pointer;transition:all .15s;}
.sfp:hover{border-color:rgba(237,232,216,.24);color:var(--t1);}
.sfp.on{background:rgba(237,232,216,.07);color:rgba(237,232,216,.88);border:1px solid rgba(237,232,216,.44);border-color:var(--amb);font-weight:400;}
.sf-sep{width:1px;height:16px;background:var(--bd2);flex-shrink:0;}
/* signal cards */
.sig-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.sig-card{background:var(--s1);border:1.5px solid var(--bd);border-radius:6px;padding:16px;transition:border-color .15s;overflow:hidden;position:relative;}
.sig-card:hover{border-color:var(--bd2);}
.sig-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;border-radius:1px 1px 0 0;}
.sig-card.long-card::before{background:linear-gradient(to right,rgba(98,242,157,.6),rgba(98,242,157,.1));}
.sig-card.short-card::before{background:linear-gradient(to right,rgba(240,112,112,.6),rgba(240,112,112,.1));}
.sig-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px;}
.sig-sym{font-family:var(--mono);font-size:15px;font-weight:400;letter-spacing:.02em;}
.sig-badges{display:flex;align-items:center;gap:4px;margin-top:5px;flex-wrap:wrap;}
.sc-badge{font-family:var(--mono);font-size:10px;font-weight:400;padding:2px 8px;border-radius:6px;}
.sc-badge.equity{background:rgba(98,242,157,.1);color:var(--grn);}
.sc-badge.crypto{background:rgba(237,232,216,.06);color:var(--amb);}
.sc-badge.forex{background:rgba(96,165,250,.1);color:#60a5fa;}
.sc-badge.options{background:rgba(167,139,250,.1);color:#a78bfa;}
.sc-badge.macro{background:rgba(52,211,153,.1);color:#34d399;}
.sc-badge.long{background:rgba(98,242,157,.12);color:var(--grn);font-weight:400;}
.sc-badge.short{background:rgba(240,112,112,.12);color:var(--red);font-weight:400;}
.sc-badge.active{background:rgba(98,242,157,.1);color:var(--grn);}
.sc-badge.triggered{background:rgba(237,232,216,.06);color:var(--amb);}
.sc-badge.pending{background:rgba(255,255,255,.04);color:var(--t3);}
.sc-badge.expired{background:rgba(240,112,112,.08);color:var(--red);}
.conf-ring{flex-shrink:0;text-align:center;}
.conf-ring-lbl{font-size:9.5px;color:var(--t3);margin-top:2px;letter-spacing:.03em;}
.sig-levels{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:11px;}
.sig-lv{background:var(--s2);border-radius:6px;padding:8px 10px;}
.sig-lv-lbl{font-size:9px;font-weight:400;letter-spacing:.07em;text-transform:uppercase;color:var(--t3);margin-bottom:3px;}
.sig-lv-val{font-family:var(--mono);font-size:13px;font-weight:400;}
.sig-lv-val.entry{color:var(--t1);}
.sig-lv-val.target{color:var(--grn);}
.sig-lv-val.stop{color:var(--red);}
.sig-stats{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.sig-curr{font-family:var(--mono);font-size:13px;font-weight:400;}
.sig-chg{font-family:var(--mono);font-size:11px;margin-left:5px;}
.sig-chg.pos{color:var(--grn);}
.sig-chg.neg{color:var(--red);}
.sig-rr{font-family:var(--mono);font-size:13px;font-weight:400;color:var(--amb);}
.sig-eta{font-size:11px;color:var(--t3);display:flex;align-items:center;gap:4px;}
.sig-analysis{font-size:11.5px;color:var(--t2);line-height:1.55;margin-bottom:10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.sig-analysis.exp{display:block;-webkit-line-clamp:unset;}
.sig-tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px;}
.sig-tag{font-size:10.5px;color:var(--t3);padding:2px 9px;border:1px solid var(--bd);border-radius:6px;background:var(--s2);}
.sig-foot{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--bd);padding-top:9px;margin-top:2px;}
.sig-ai{font-size:11px;color:var(--t3);display:flex;align-items:center;gap:5px;}
.sig-ai-dot{width:5px;height:5px;border-radius:50%;background:var(--amb);flex-shrink:0;}
.sig-tog{font-size:11.5px;color:var(--amb);cursor:pointer;}
.sig-tog:hover{opacity:.75;}
.sf-empty{text-align:center;padding:60px 20px;color:var(--t3);font-size:13px;grid-column:1/-1;}

/* ═══ PAGE HEADER ═══ */
.pg-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-shrink:0;}
.pg-hd-left{display:flex;flex-direction:column;gap:2px;}
.pg-hd-title{font-size:18px;font-weight:400;letter-spacing:-.3px;}
.pg-hd-sub{font-size:12.5px;color:var(--t3);}
.pg-hd-right{display:flex;gap:8px;align-items:center;}
.pg-tag{font-size:11px;font-weight:400;letter-spacing:.06em;padding:4px 12px;border-radius:6px;border:1px solid var(--bd2);color:var(--t2);background:var(--s2);}
.pg-tag.live{border-color:rgba(98,242,157,.4);color:var(--grn);background:rgba(98,242,157,.08);}
.pg-tag.live::before{content:'';display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--grn);margin-right:5px;animation:pulse 1.8s infinite;}

/* ═══ MARKET PAGE ═══ */

/* ── Ticker strip ── */
.mkt-ticker-bar{
  display:flex;gap:0;overflow:hidden;
  background:rgba(9,8,13,.75);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid rgba(237,232,216,.10);
  border-radius:8px;margin-bottom:16px;
}
.mkt-tick{
  flex:1;padding:12px 16px;border-right:1px solid rgba(237,232,216,.07);
  position:relative;transition:background .15s;cursor:default;
}
.mkt-tick:last-child{border-right:none;}
.mkt-tick:hover{background:rgba(237,232,216,.04);}
.mkt-tick-sym{
  font-size:9.5px;font-weight:500;color:rgba(237,232,216,.4);
  letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px;
}
.mkt-tick-val{
  font-family:var(--mono);font-size:14px;font-weight:400;
  color:rgba(237,232,216,.92);letter-spacing:.01em;
}
.mkt-tick-chg{font-family:var(--mono);font-size:10.5px;margin-top:3px;font-weight:300;}
.mkt-tick-chg.up{color:#62f29d;}
.mkt-tick-chg.dn{color:#f07070;}
/* Micro sparkline bar at bottom of each tick */
.mkt-tick-spark{
  position:absolute;bottom:0;left:0;right:0;height:2px;
  border-radius:0 0 4px 4px;opacity:.6;
}

/* ── Grid layouts ── */
.mkt-body{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:12px;}
.mkt-body-wide{display:grid;grid-template-columns:2fr 1fr;gap:12px;margin-bottom:12px;}
.mkt-body-full{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:12px;}

/* ── Section cards ── */
.mkt-section-card{
  background:rgba(9,8,13,.68);
  backdrop-filter:blur(18px) saturate(160%);
  -webkit-backdrop-filter:blur(18px) saturate(160%);
  border:1px solid rgba(237,232,216,.09);
  border-radius:8px;overflow:hidden;
  position:relative;
}
/* colored top accent */
.mkt-section-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(237,232,216,.24),transparent);
}
.mkt-sc-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:13px 16px 10px;
  border-bottom:1px solid rgba(237,232,216,.06);
}
.mkt-sc-title{
  font-size:12px;font-weight:500;letter-spacing:.04em;
  text-transform:uppercase;color:rgba(237,232,216,.75);
}
.mkt-sc-sub{font-size:10.5px;color:rgba(237,232,216,.32);letter-spacing:.02em;}
.mkt-sc-badge{
  font-family:var(--mono);font-size:10px;font-weight:400;
  padding:2px 7px;border-radius:3px;
  background:rgba(237,232,216,.06);
  border:1px solid rgba(237,232,216,.15);
  color:rgba(237,232,216,.72);
}

/* ── Asset rows ── */
.mkt-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 16px;border-bottom:1px solid rgba(255,255,255,.03);
  transition:background .14s;cursor:pointer;
}
.mkt-row:last-child{border-bottom:none;}
.mkt-row:hover{background:rgba(201,168,76,.04);border-bottom-color:rgba(201,168,76,.08);}
.mkt-row:hover .mkt-row-arrow{stroke:rgba(201,168,76,.8) !important;transform:translateX(2px);}
.mkt-row:hover .mkt-row-name{color:rgba(237,232,216,.95);}
.mkt-row:active{background:rgba(201,168,76,.07);}
.mkt-row-left{display:flex;align-items:center;gap:11px;}
.mkt-row-icon{
  width:30px;height:30px;border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;font-size:10px;font-weight:600;
  letter-spacing:.02em;position:relative;
  border:1px solid rgba(255,255,255,.03);
}
/* Glow dot in top-right of icon */
.mkt-row-icon::after{
  content:'';position:absolute;top:4px;right:4px;
  width:4px;height:4px;border-radius:50%;
  background:currentColor;opacity:.6;
}
.mkt-row-name{font-size:13px;font-weight:400;color:rgba(237,232,216,.88);}
.mkt-row-sub{font-size:10.5px;color:rgba(237,232,216,.34);margin-top:1px;}
.mkt-row-right{text-align:right;}
.mkt-row-price{font-family:var(--mono);font-size:13px;font-weight:400;color:rgba(237,232,216,.9);}
.mkt-row-chg{font-family:var(--mono);font-size:10.5px;margin-top:3px;font-weight:300;}
.mkt-row-chg.up{color:#62f29d;}
.mkt-row-chg.dn{color:#f07070;}

/* ── Mini inline performance bar ── */
.mkt-row-bar{height:2px;margin-top:5px;border-radius:6px;width:48px;background:rgba(255,255,255,.03);}
.mkt-row-bar-fill{height:100%;border-radius:6px;transition:width .5s ease;}

/* ── Sector momentum bars ── */
.mkt-bar-wrap{padding:12px 16px;}
.mkt-bar-row{
  display:flex;align-items:center;gap:10px;margin-bottom:10px;
}
.mkt-bar-row:last-child{margin-bottom:0;}
.mkt-bar-lbl{font-size:11.5px;color:rgba(237,232,216,.6);width:96px;flex-shrink:0;letter-spacing:.01em;}
.mkt-bar-track{
  flex:1;height:4px;
  background:rgba(255,255,255,.05);
  border-radius:2px;overflow:hidden;
  position:relative;
}
.mkt-bar-fill{
  height:100%;border-radius:2px;
  position:relative;
  box-shadow:0 0 8px var(--mkt-bar-glow,rgba(237,232,216,.26));
  transition:width .6s cubic-bezier(.16,1,.3,1);
}
.mkt-bar-val{
  font-family:var(--mono);font-size:11px;
  color:rgba(237,232,216,.45);width:36px;text-align:right;flex-shrink:0;
}

/* ── Sector heatmap ── */
.mkt-heatmap{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;padding:14px;}
.mkt-heat-cell{
  padding:10px 6px 9px;border-radius:6px;text-align:center;
  cursor:pointer;transition:all .18s;
  border:1px solid transparent;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
.mkt-heat-cell:hover{
  transform:translateY(-2px) scale(1.04);
  box-shadow:0 6px 20px rgba(0,0,0,.5);
  border-color:rgba(237,232,216,.2)!important;
}
.mkt-heat-sym{font-size:9.5px;font-weight:600;color:rgba(200,210,232,.82);letter-spacing:.03em;}
.mkt-heat-val{font-family:var(--mono);font-size:9px;margin-top:4px;font-weight:300;}

/* ── Economic calendar ── */
.mkt-ec-row{
  display:flex;align-items:flex-start;gap:12px;
  padding:10px 16px;border-bottom:1px solid rgba(255,255,255,.03);
  transition:background .13s;cursor:default;
}
.mkt-ec-row:hover{background:rgba(237,232,216,.025);}
.mkt-ec-row:last-child{border-bottom:none;}
.mkt-ec-time{
  font-family:var(--mono);font-size:10.5px;color:rgba(237,232,216,.36);
  width:42px;flex-shrink:0;padding-top:2px;
}
.mkt-ec-impact-wrap{display:flex;flex-direction:column;align-items:center;flex-shrink:0;padding-top:4px;}
.mkt-ec-dot{
  width:7px;height:7px;border-radius:50%;flex-shrink:0;
  box-shadow:0 0 6px currentColor;
}
.mkt-ec-line{width:1px;flex:1;background:rgba(255,255,255,.03);margin:3px 0 0;}
.mkt-ec-body{flex:1;}
.mkt-ec-event{font-size:12.5px;font-weight:400;color:rgba(237,232,216,.84);line-height:1.4;}
.mkt-ec-country{font-size:10.5px;color:rgba(237,232,216,.35);margin-top:2px;}
.mkt-ec-forecast{
  font-family:var(--mono);font-size:10.5px;
  color:rgba(237,232,216,.60);margin-top:3px;
}
.mkt-ec-impact-tag{
  font-size:9px;font-weight:600;letter-spacing:.06em;
  padding:1px 5px;border-radius:3px;margin-top:4px;display:inline-block;
}

/* ── Fear & Greed ── */
.mkt-fear-gauge{padding:16px 16px 12px;text-align:center;}
.mkt-fear-arc{position:relative;width:96px;height:54px;margin:0 auto 10px;}
.mkt-fear-val{
  font-size:30px;font-weight:300;font-family:var(--mono);
  line-height:1;letter-spacing:-.02em;
}
.mkt-fear-lbl{font-size:10.5px;color:rgba(237,232,216,.38);margin-top:4px;letter-spacing:.04em;text-transform:uppercase;}
.mkt-fear-bar{
  height:5px;border-radius:3px;
  background:linear-gradient(to right,
    rgba(98,242,157,.8) 0%,
    rgba(237,232,216,.62) 50%,
    rgba(240,112,112,.8) 100%);
  margin:12px 0 4px;position:relative;
}
.mkt-fear-pin{
  position:absolute;top:50%;transform:translate(-50%,-50%);
  width:11px;height:11px;border-radius:50%;
  background:#e2ddf5;
  border:2px solid rgba(9,8,13,.9);
  box-shadow:0 0 8px rgba(237,232,216,.44);
}
.mkt-fear-scale{display:flex;justify-content:space-between;font-size:9px;color:rgba(237,232,216,.28);letter-spacing:.02em;}

/* ── Signals movers strip ── */
.mkt-movers{display:flex;gap:10px;padding:12px 16px;overflow-x:auto;}
.mkt-mover-card{
  flex-shrink:0;min-width:100px;padding:10px 12px;
  background:rgba(255,255,255,.03);
  border:1px solid rgba(255,255,255,.03);
  border-radius:6px;cursor:pointer;transition:all .15s;
}
.mkt-mover-card:hover{
  background:rgba(237,232,216,.05);
  border-color:rgba(237,232,216,.18);
  box-shadow:0 0 12px rgba(237,232,216,.08);
}
.mkt-mover-sym{font-size:11px;font-weight:600;letter-spacing:.04em;margin-bottom:4px;}
.mkt-mover-chg{font-family:var(--mono);font-size:13px;font-weight:300;}
.mkt-mover-name{font-size:10px;color:rgba(237,232,216,.36);margin-top:2px;}

/* ── Signal alert strip ── */
.mkt-sig-row{
  display:flex;align-items:center;gap:12px;padding:9px 16px;
  border-bottom:1px solid rgba(255,255,255,.03);
  cursor:pointer;transition:background .13s;
}
.mkt-sig-row:hover{background:rgba(237,232,216,.04);}
.mkt-sig-row:last-child{border-bottom:none;}
.mkt-sig-badge{
  font-size:9.5px;font-weight:600;letter-spacing:.06em;
  padding:3px 8px;border-radius:4px;flex-shrink:0;
}
.mkt-sig-badge.buy{
  background:rgba(98,242,157,.1);border:1px solid rgba(98,242,157,.3);
  color:#62f29d;box-shadow:0 0 8px rgba(98,242,157,.15);
}
.mkt-sig-badge.sell{
  background:rgba(240,112,112,.1);border:1px solid rgba(240,112,112,.3);
  color:#f07070;box-shadow:0 0 8px rgba(240,112,112,.15);
}
.mkt-sig-sym{font-size:13px;font-weight:500;color:rgba(237,232,216,.88);width:52px;flex-shrink:0;}
.mkt-sig-detail{font-size:11px;color:rgba(237,232,216,.42);flex:1;}
.mkt-sig-conf{
  font-family:var(--mono);font-size:10px;
  color:rgba(237,232,216,.62);flex-shrink:0;
}

/* ═══ PORTFOLIO PAGE ═══ */
.pf-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;}
.pf-card{background:var(--s1);border:1px solid var(--bd);border-radius:6px;padding:16px 18px;}
.pf-card-lbl{font-size:11.5px;color:var(--t3);margin-bottom:6px;letter-spacing:.04em;}
.pf-card-val{font-size:22px;font-weight:400;font-family:var(--mono);}
.pf-card-val.grn{color:var(--grn);}
.pf-card-val.red{color:var(--red);}
.pf-card-sub{font-size:11px;color:var(--t3);margin-top:4px;}
.pf-body{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-bottom:14px;}
.pf-pos-card{background:var(--s1);border:1px solid var(--bd);border-radius:6px;overflow:hidden;}
.pf-pos-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--bd);}
.pf-pos-title{font-size:13px;font-weight:400;}
.pf-pos-filter{display:flex;gap:4px;}
.pf-pf{font-size:11px;padding:3px 10px;border-radius:6px;border:1px solid var(--bd);color:var(--t3);background:transparent;cursor:pointer;transition:.15s;}
.pf-pf.on{background:rgba(237,232,216,.07);color:rgba(237,232,216,.88);border:1px solid rgba(237,232,216,.44);border-color:var(--amb);font-weight:400;}
.pf-pos-table{width:100%;border-collapse:collapse;font-size:12px;}
.pf-pos-table th{padding:8px 14px;text-align:left;font-size:10.5px;font-weight:400;letter-spacing:.06em;color:var(--t3);border-bottom:1px solid var(--bd);white-space:nowrap;}
.pf-pos-table td{padding:9px 14px;border-bottom:1px solid rgba(255,255,255,.04);vertical-align:middle;}
.pf-pos-table tr:last-child td{border-bottom:none;}
.pf-pos-row{cursor:pointer;transition:background .15s;}
.pf-pos-row:hover td{background:rgba(237,232,216,.04)!important;}
.pf-pos-expand{padding:14px 16px 16px;background:rgba(6,7,12,.9);border-top:1px solid rgba(237,232,216,.08);}
.pf-exp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:4px;}
@media(max-width:600px){.pf-exp-grid{grid-template-columns:repeat(2,1fr);}}
.pf-exp-cell{background:rgba(237,232,216,.04);border:1px solid rgba(237,232,216,.07);border-radius:5px;padding:7px 10px;}
.pf-exp-lbl{font-size:9px;color:var(--t3);letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px;}
.pf-exp-val{font-family:var(--mono);font-size:12px;color:var(--t1);font-weight:500;}
.pf-sl-auto-wrap{background:rgba(237,232,216,.03);border:1px solid rgba(237,232,216,.09);border-radius:6px;padding:10px 12px;margin:8px 0 0;}
.pf-sl-auto-title{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:600;letter-spacing:.07em;color:rgba(237,232,216,.6);text-transform:uppercase;margin-bottom:8px;}
.pf-sl-auto-row{display:flex;flex-direction:column;gap:8px;}
.pf-sl-btn{display:flex;align-items:center;gap:6px;background:rgba(237,232,216,.08);border:1px solid rgba(237,232,216,.2);border-radius:5px;color:rgba(237,232,216,.8);font-size:11px;font-family:var(--mono);padding:6px 12px;cursor:pointer;transition:background .15s;white-space:nowrap;}
.pf-sl-btn:hover{background:rgba(237,232,216,.15);border-color:rgba(237,232,216,.35);}
.pf-trail-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.pf-trail-lbl{font-size:11px;color:var(--t3);font-family:var(--mono);}
.pf-trail-inp{width:60px;background:rgba(237,232,216,.07);border:1px solid rgba(237,232,216,.18);border-radius:4px;color:rgba(200,210,230,.9);font-size:11px;font-family:var(--mono);padding:4px 8px;outline:none;}
.pf-pos-table tr:hover td{background:rgba(255,255,255,.02);}
.pos-sym{font-family:var(--mono);font-size:12.5px;font-weight:400;}
.pos-cls-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;}
.pos-pnl-pos{color:var(--grn);font-family:var(--mono);}
.pos-pnl-neg{color:var(--red);font-family:var(--mono);}
.pos-act-btn{font-size:10.5px;padding:3px 10px;border-radius:6px;background:var(--s3);border:1px solid var(--bd2);color:var(--t2);cursor:pointer;white-space:nowrap;}
.pos-act-btn:hover{border-color:var(--amb);color:var(--amb);}
.pf-alloc-card{background:var(--s1);border:1px solid var(--bd);border-radius:6px;padding:16px;}
.pf-alloc-title{font-size:13px;font-weight:400;margin-bottom:12px;}
.pf-alloc-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.pf-alloc-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.pf-alloc-name{font-size:12.5px;flex:1;}
.pf-alloc-bar-track{flex:2;height:4px;background:rgba(255,255,255,.04);border-radius:6px;}
.pf-alloc-bar-fill{height:100%;border-radius:6px;}
.pf-alloc-pct{font-family:var(--mono);font-size:11px;color:var(--t3);width:32px;text-align:right;}

/* ═══ RISK PAGE ═══ */
.risk-overview{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;}
.risk-mc{background:var(--s1);border:1px solid var(--bd);border-radius:6px;padding:16px 18px;}
.risk-mc-lbl{font-size:11.5px;color:var(--t3);margin-bottom:6px;}
.risk-mc-val{font-size:22px;font-weight:400;font-family:var(--mono);}
.risk-mc-bar{height:4px;border-radius:6px;background:rgba(255,255,255,.04);margin:8px 0 4px;}
.risk-mc-fill{height:100%;border-radius:6px;transition:width .4s ease;}
.risk-mc-sub{font-size:11px;color:var(--t3);}
.risk-body{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;}
.risk-card{background:var(--s1);border:1px solid var(--bd);border-radius:6px;overflow:hidden;}
.risk-card-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;border-bottom:1px solid var(--bd);}
.risk-card-title{font-size:13px;font-weight:400;}
.risk-alert-row{display:flex;align-items:flex-start;gap:10px;padding:10px 16px;border-bottom:1px solid rgba(255,255,255,.04);}
.risk-alert-row:last-child{border-bottom:none;}
.risk-al-icon{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.risk-al-icon.warn{background:rgba(237,232,216,.08);}
.risk-al-icon.crit{background:rgba(240,112,112,.12);}
.risk-al-icon.info{background:rgba(201,168,76,.1);}
.risk-al-title{font-size:12.5px;font-weight:400;}
.risk-al-sub{font-size:11.5px;color:var(--t3);margin-top:2px;}
.risk-al-time{font-size:10.5px;color:var(--t3);margin-top:4px;}
.risk-heat-wrap{padding:12px 16px;}
.risk-heat-row{display:flex;align-items:center;gap:6px;margin-bottom:5px;}
.risk-heat-row:first-child .risk-hc{background:none !important;}
.risk-hc{width:48px;height:36px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:400;flex-shrink:0;}
.risk-hc.hdr{font-size:10.5px;color:var(--t3);font-weight:400;background:none !important;}
.risk-hc.row-lbl{font-size:11px;color:var(--t2);font-weight:400;background:none !important;justify-content:flex-start;}
.risk-dd-wrap{padding:16px;}
.risk-dd-track{height:8px;border-radius:6px;background:rgba(255,255,255,.04);overflow:hidden;margin:8px 0;}
.risk-dd-fill{height:100%;border-radius:6px;background:var(--amb);}
.risk-dd-labels{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10.5px;color:var(--t3);}
.risk-dd-zones{display:flex;gap:6px;margin-top:10px;}
.risk-dd-zone{flex:1;padding:8px 10px;border-radius:6px;border:1px solid var(--bd);}
.risk-dd-zone-lbl{font-size:10.5px;color:var(--t3);margin-bottom:3px;}
.risk-dd-zone-val{font-family:var(--mono);font-size:13px;font-weight:400;}
/* ── Risk Manager rm-* panels (no collision with settings .risk-card) ── */
.rm-panel{background:var(--s1);border:1px solid var(--bd);border-radius:12px;overflow:hidden;backdrop-filter:blur(12px);}
.rm-panel-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 12px;border-bottom:1px solid var(--bd);}
.rm-panel-title{font-size:12.5px;font-weight:500;color:var(--t1);letter-spacing:.04em;text-transform:uppercase;}
.rm-panel-body{padding:16px;}
/* positions table */
.rm-pos-table{width:100%;border-collapse:collapse;font-size:11.5px;}
.rm-pos-table th{font-size:10px;color:var(--t3);text-align:left;padding:6px 8px;border-bottom:1px solid var(--bd);text-transform:uppercase;letter-spacing:.06em;}
.rm-pos-table td{padding:8px 8px;border-bottom:1px solid rgba(255,255,255,.03);vertical-align:middle;}
.rm-pos-table tr:last-child td{border-bottom:none;}
.rm-pos-dir{display:inline-block;font-size:9.5px;font-weight:500;padding:2px 7px;border-radius:4px;letter-spacing:.06em;}
.rm-pos-dir.long{background:rgba(93,232,160,.12);color:var(--grn);border:1px solid rgba(93,232,160,.25);}
.rm-pos-dir.short{background:rgba(232,112,110,.12);color:var(--red);border:1px solid rgba(232,112,110,.25);}
.rm-pnl-up{color:var(--grn);font-family:var(--mono);}
.rm-pnl-dn{color:var(--red);font-family:var(--mono);}
.rm-var-bar-wrap{width:100%;height:5px;background:rgba(255,255,255,.05);border-radius:2px;overflow:hidden;}
.rm-var-bar-fill{height:100%;border-radius:2px;}
/* stress test */
.rm-stress-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.04);}
.rm-stress-row:last-child{border-bottom:none;}
.rm-stress-sym{font-size:12px;color:var(--t1);width:80px;font-family:var(--mono);}
.rm-stress-cls{font-size:10.5px;color:var(--t3);width:70px;}
.rm-stress-slider{flex:1;height:4px;border-radius:2px;accent-color:var(--gold);}
.rm-stress-shock{width:60px;font-size:12px;font-family:var(--mono);color:var(--red);text-align:right;}
.rm-stress-pnl{width:80px;font-size:12px;font-family:var(--mono);text-align:right;}
.rm-stress-total{display:flex;justify-content:space-between;padding:12px 0 0;border-top:1px solid var(--bd);margin-top:6px;}
.rm-stress-total-lbl{font-size:12px;color:var(--t2);}
.rm-stress-total-val{font-size:14px;font-family:var(--mono);color:var(--red);}
/* var breakdown */
.rm-var-row{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.04);}
.rm-var-row:last-child{border-bottom:none;}
.rm-var-sym{font-size:12px;color:var(--t1);width:70px;font-family:var(--mono);}
.rm-var-lbl{font-size:10.5px;color:var(--t3);width:100px;}
.rm-var-track{flex:1;height:5px;background:rgba(255,255,255,.05);border-radius:2px;overflow:hidden;}
.rm-var-fill{height:100%;border-radius:2px;}
.rm-var-val{width:70px;font-size:12px;font-family:var(--mono);text-align:right;}
/* optimisation */
.rm-opt-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:16px;}
.rm-opt-cell{background:rgba(255,255,255,.03);border:1px solid var(--bd);border-radius:8px;padding:10px 12px;}
.rm-opt-cell-lbl{font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px;}
.rm-opt-cell-val{font-size:16px;font-family:var(--mono);font-weight:400;color:var(--crys);}
.rm-opt-cell-sub{font-size:10px;color:var(--t3);margin-top:3px;}
/* drawdown history */
.rm-dd-evt-row{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.04);}
.rm-dd-evt-row:last-child{border-bottom:none;}
.rm-dd-evt-date{font-size:10.5px;color:var(--t3);width:60px;}
.rm-dd-evt-bar-wrap{flex:1;height:6px;background:rgba(255,255,255,.04);border-radius:2px;overflow:hidden;}
.rm-dd-evt-bar-fill{height:100%;background:var(--red);border-radius:2px;}
.rm-dd-evt-pct{font-size:12px;font-family:var(--mono);color:var(--red);width:52px;text-align:right;}
.rm-dd-evt-days{font-size:10.5px;color:var(--t3);width:60px;text-align:right;}
/* risk params */
.rm-params-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px;}
.rm-param-row{display:flex;flex-direction:column;gap:6px;}
.rm-param-lbl{font-size:10.5px;color:var(--t3);text-transform:uppercase;letter-spacing:.05em;}
.rm-param-input{background:rgba(255,255,255,.04);border:1px solid var(--bd);border-radius:6px;padding:7px 10px;font-size:12px;font-family:var(--mono);color:var(--t1);outline:none;width:100%;box-sizing:border-box;}
.rm-param-input:focus{border-color:var(--gold);}
.rm-param-save{background:var(--gold2);border:1px solid var(--gold);color:var(--gold);border-radius:6px;padding:8px 20px;font-size:12px;cursor:pointer;transition:all .2s;}
.rm-param-save:hover{background:var(--gold);color:#06070a;}
/* two-col layout */
.rm-2col{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;}
.rm-3col{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-bottom:14px;}


/* ═══ PERFORMANCE PAGE ═══ */
.perf-overview{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px;}
.perf-mc{background:var(--s1);border:1px solid var(--bd);border-radius:6px;padding:14px 16px;}
.perf-mc-lbl{font-size:11px;color:var(--t3);margin-bottom:5px;letter-spacing:.04em;}
.perf-mc-val{font-size:20px;font-weight:400;font-family:var(--mono);}
.perf-mc-trend{font-size:11px;margin-top:3px;}
.perf-mc-trend.up{color:var(--grn);}
.perf-mc-trend.dn{color:var(--red);}
.perf-body{display:grid;grid-template-columns:3fr 1fr;gap:14px;margin-bottom:14px;}
.perf-body2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;}
.perf-card{background:var(--s1);border:1px solid var(--bd);border-radius:6px;overflow:hidden;}
.perf-card-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;border-bottom:1px solid var(--bd);}
.perf-card-title{font-size:13px;font-weight:400;}
.perf-card-sub{font-size:11px;color:var(--t3);}
.perf-card-body{padding:14px 16px;}
.perf-streak-wrap{display:flex;gap:4px;padding:12px 16px;flex-wrap:wrap;}
.perf-streak-box{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;}
.perf-streak-box.w{background:rgba(98,242,157,.25);}
.perf-streak-box.l{background:rgba(240,112,112,.2);}
.perf-streak-box.n{background:rgba(255,255,255,.04);}
.perf-asset-row{display:flex;align-items:center;gap:10px;padding:9px 16px;border-bottom:1px solid rgba(255,255,255,.04);}
.perf-asset-row:last-child{border-bottom:none;}
.perf-asset-name{font-size:12.5px;font-weight:400;width:60px;}
