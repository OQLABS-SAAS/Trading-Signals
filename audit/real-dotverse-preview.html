.perf-asset-bar-track{flex:1;height:5px;background:rgba(255,255,255,.04);border-radius:6px;overflow:hidden;}
.perf-asset-bar-fill{height:100%;border-radius:6px;}
.perf-asset-stat{font-family:var(--mono);font-size:11.5px;width:40px;text-align:right;}
.perf-log-row{display:flex;align-items:center;gap:10px;padding:8px 16px;border-bottom:1px solid rgba(255,255,255,.04);font-size:12px;}
.perf-log-row:last-child{border-bottom:none;}
.perf-log-dir{width:36px;padding:2px 6px;border-radius:6px;font-size:10px;font-weight:400;text-align:center;}
.perf-log-dir.long{background:rgba(98,242,157,.15);color:var(--grn);}
.perf-log-dir.short{background:rgba(240,112,112,.12);color:var(--red);}
.perf-log-sym{font-family:var(--mono);font-size:12px;font-weight:400;width:70px;}
.perf-log-pnl{font-family:var(--mono);font-size:12px;margin-left:auto;}
.perf-log-date{font-size:11px;color:var(--t3);width:60px;text-align:right;}

/* ═══ ALERTS PAGE ═══ */
.al-toolbar{display:flex;align-items:center;gap:8px;margin-bottom:16px;}
.al-filter-pill{font-size:11.5px;padding:5px 14px;border-radius:6px;border:1px solid var(--bd);color:var(--t2);background:transparent;cursor:pointer;transition:.15s;}
.al-filter-pill.on{background:rgba(237,232,216,.07);color:rgba(237,232,216,.88);border:1px solid rgba(237,232,216,.44);border-color:var(--amb);font-weight:400;}
.al-spacer{flex:1;}
.al-new-btn{display:flex;align-items:center;gap:6px;font-size:12px;padding:6px 14px;border-radius:6px;background:rgba(237,232,216,.07);color:rgba(237,232,216,.88);border:1px solid rgba(237,232,216,.44);font-weight:400;border:none;cursor:pointer;}
.al-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;}
.al-card{background:var(--s1);border:1px solid var(--bd);border-radius:8px;padding:15px 16px;position:relative;}
.al-card.unread{border-left:3px solid var(--amb);}
.al-card.crit{border-left:3px solid var(--red);}
.al-card-top{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.al-card-icon{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.al-card-sym{font-size:13px;font-weight:400;flex:1;}
.al-card-time{font-size:10.5px;color:var(--t3);}
.al-card-msg{font-size:12.5px;color:var(--t2);line-height:1.5;margin-bottom:10px;}
.al-card-foot{display:flex;align-items:center;gap:6px;}
.al-ack-btn{font-size:11px;padding:4px 12px;border-radius:6px;background:var(--s3);border:1px solid var(--bd2);color:var(--t2);cursor:pointer;}
.al-ack-btn:hover{border-color:var(--amb);color:var(--amb);}
.al-dis-btn{font-size:11px;padding:4px 10px;border-radius:6px;background:transparent;border:1px solid var(--bd);color:var(--t3);cursor:pointer;}
.al-rem-btn{font-size:11px;padding:4px 10px;border-radius:6px;background:transparent;border:1px solid rgba(224,85,85,.4);color:rgba(224,85,85,.85);cursor:pointer;margin-left:auto;}
.al-rem-btn:hover{background:rgba(224,85,85,.08);border-color:rgba(224,85,85,.7);color:rgba(224,85,85,1);}
.al-rule-section{background:var(--s1);border:1px solid var(--bd);border-radius:8px;overflow:hidden;margin-bottom:12px;}
.al-rule-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--bd);}
.al-rule-title{font-size:13px;font-weight:400;}
.al-rule-row{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid rgba(255,255,255,.04);}
.al-rule-row:last-child{border-bottom:none;}
.al-rule-name{font-size:12.5px;font-weight:400;flex:1;}
.al-rule-cond{font-family:var(--mono);font-size:11.5px;color:var(--t3);}
.al-rule-toggle{position:relative;width:36px;height:20px;background:var(--s3);border-radius:6px;border:1px solid var(--bd2);cursor:pointer;flex-shrink:0;}
.al-rule-toggle.on{background:var(--amb);border-color:var(--amb);}
.al-rule-toggle::after{content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:rgba(237,232,216,.06);transition:.2s;}
.al-rule-toggle.on::after{left:18px;}

/* ═══ NEWS PAGE ═══ */
.news-toolbar{display:flex;align-items:center;gap:8px;margin-bottom:16px;}
.news-filter-pill{font-size:11.5px;padding:5px 14px;border-radius:6px;border:1px solid var(--bd);color:var(--t2);background:transparent;cursor:pointer;transition:.15s;}
.news-filter-pill.on{background:rgba(237,232,216,.08);color:var(--amb);border-color:rgba(237,232,216,.28);font-weight:400;}
.news-body{display:grid;grid-template-columns:2fr 1fr;gap:14px;}
.news-main-card{background:var(--s1);border:1px solid var(--bd);border-radius:6px;overflow:hidden;}
.news-feat{padding:18px;border-bottom:1px solid var(--bd);cursor:default;}
.news-feat:hover{}
.news-feat-cat{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:400;letter-spacing:.06em;padding:2px 9px;border-radius:6px;margin-bottom:10px;}
.news-feat-cat.macro{background:rgba(96,165,250,.12);color:#60a5fa;}
.news-feat-cat.crypto{background:rgba(237,232,216,.07);color:var(--amb);}
.news-feat-cat.equity{background:rgba(98,242,157,.1);color:var(--grn);}
.news-feat-cat.forex{background:rgba(167,139,250,.1);color:#a78bfa;}
.news-feat-h{font-size:15px;font-weight:400;line-height:1.4;margin-bottom:6px;}
.news-feat-body{font-size:12.5px;color:var(--t2);line-height:1.6;margin-bottom:10px;}
.news-feat-foot{display:flex;align-items:center;gap:10px;}
.news-feat-src{font-size:11px;color:var(--t3);}
.news-feat-time{font-size:11px;color:var(--t3);}
.news-sent{font-size:11px;padding:2px 9px;border-radius:6px;font-weight:400;}
.news-sent.bull{background:rgba(98,242,157,.12);color:var(--grn);}
.news-sent.bear{background:rgba(240,112,112,.1);color:var(--red);}
.news-sent.neut{background:rgba(255,255,255,.04);color:var(--t3);}
.news-list-row{display:flex;align-items:flex-start;gap:10px;padding:11px 18px;border-bottom:1px solid rgba(255,255,255,.04);cursor:default;}
.news-list-row:last-child{border-bottom:none;}
.news-list-row:hover{}
.news-list-cat{width:50px;flex-shrink:0;padding-top:2px;}
.news-list-h{font-size:12.5px;font-weight:400;flex:1;line-height:1.4;}
.news-list-time{font-size:11px;color:var(--t3);width:44px;text-align:right;flex-shrink:0;padding-top:2px;}
.news-sidebar-card{background:var(--s1);border:1px solid var(--bd);border-radius:6px;overflow:hidden;margin-bottom:12px;}
.news-sb-head{padding:13px 15px;border-bottom:1px solid var(--bd);font-size:13px;font-weight:400;}
.news-ticker-row{display:flex;align-items:center;justify-content:space-between;padding:9px 15px;border-bottom:1px solid rgba(255,255,255,.04);cursor:pointer;transition:background .13s;}
.news-ticker-row:hover{background:rgba(237,232,216,.04);}
.news-ticker-row:last-child{border-bottom:none;}
.news-ticker-sym{font-family:var(--mono);font-size:12px;font-weight:400;width:56px;}
.news-ticker-count{font-size:11.5px;color:var(--t3);}
.news-ticker-sent{font-size:11px;padding:2px 8px;border-radius:6px;}
.news-cal-row{display:flex;align-items:center;gap:10px;padding:9px 15px;border-bottom:1px solid rgba(255,255,255,.04);}
.news-cal-row:last-child{border-bottom:none;}
.news-cal-time{font-family:var(--mono);font-size:11px;color:var(--t3);width:36px;flex-shrink:0;}
.news-cal-event{font-size:12px;flex:1;}
.news-cal-imp{width:8px;height:8px;border-radius:50%;flex-shrink:0;}

/* Ultra-thin separators */
hr, .divider, [class*="-sep"], [class*="-divider"] {
  border: none !important;
  border-top: 1px solid rgba(148,165,198,.08) !important;
  height: 0 !important;
}
/* Refined letter-spacing on display headings */
h1, h2, h3, .syne, [class*="title"], [class*="heading"] {
  letter-spacing: -0.02em;
  font-family: var(--syne), sans-serif;
}
/* Data values — mono, crystal, tight */
.mono, [class*="-val"], [class*="-price"], [class*="-stat"],
.ticker-price, .sig-price, .rr-val, .calc-result {
  font-family: var(--mono), monospace;
  letter-spacing: 0.01em;
  color: var(--t1);
}
/* Body copy — space grotesk, slightly airy */
p, li, span:not([class*="badge"]):not([class*="chip"]) {
  letter-spacing: 0.005em;
}
/* Border lines: 1px steel */
.card, .panel, .sig-card, .perf-card, .alt-card,
.mt5-panel, .port-card, .settings-card, .onb-box,
.modal-box, .sidebar-panel {
  border-width: 1px !important;
  border-style: solid !important;
  border-color: var(--bd) !important;
}
/* Subtle inner glow on active/focused elements */
input:focus, select:focus, textarea:focus {
  outline: none !important;
  border-color: rgba(114,180,204,.45) !important;
  box-shadow: 0 0 0 3px rgba(114,180,204,.08) !important;
}
/* Refined nav tab active indicator */
.nav-tab.active, [class*="nav"][class*="active"] {
  border-bottom: 1px solid var(--topaz) !important;
  color: var(--topaz) !important;
}
/* Number data: amber warmth for positive, crystal for neutral */
.grn, [class*="-buy"], [class*="buy-"] { color: var(--grn) !important; }
.red, [class*="-sell"], [class*="sell-"] { color: var(--red) !important; }






/* ╔══════════════════════════════════════════════════════════════════════════╗
   ║  DOTVERSE GLASS SHIP — MASTER STYLE LAYER                              ║
   ║  Every surface is translucent. The constellation is always alive.      ║
   ╚══════════════════════════════════════════════════════════════════════════╝ */

/* ── Canvas: fixed, always alive behind every page ── */
canvas#gx {
  position: fixed !important;
  top: 0; left: 0;
  width: 100vw !important;
  height: 100vh !important;
  z-index: 0 !important;
  pointer-events: none !important;
  display: block !important;
}

/* ── Body: dark base, no overflow cut ── */
html, body {
  background: #07080b !important;
  height: 100% !important;
  overflow: hidden !important;
}
body > *:not(canvas) {
  position: relative;
  z-index: 1;
}

/* ── All views above canvas ── */
[class^="v"][id^="v"]:not(.view),
.app-shell, .app-layout, .app-nav,
.nav-bar, nav, header, .sidebar,
.dash-layout, .dash-main, .dash-nav {
  position: relative !important;
  z-index: 2 !important;
}
/* Ensure dashboard view stays fixed-inset so dcontent can scroll */
#vDash { position: fixed !important; inset: 0; display: none; }
#vDash.active { display: flex !important; }

/* ════════════════════════════════════════════════════════
   UNIVERSAL GLASS SURFACE
   Every structural box becomes a frosted glass pane
   ════════════════════════════════════════════════════════ */
.card, .panel,
[class$="-card"], [class$="-panel"],
[class*="-section"], [class*="section-"],
[class*="-wrap"]:not([class*="bar-wrap"]):not([class*="input"]):not([class*="icon"]),
[class*="-box"]:not([class*="check"]):not([class*="input"]),
.modal-box, .modal-inner,
.sig-card, .sig-hero, .sig-panel,
.calc-body, .calc-wrap,
.scanner-wrap, .scanner-table-wrap,
.perf-card, .alt-card,
.port-card, .port-panel,
.settings-card, .sett-sect,
.onb-box, .onb-inner,
.explain-panel,
.mt5-panel, .trade-card,
.cor-heatmap,
.backtest-panel, .bt-panel,
.journey-panel, .next-steps-panel,
.mkt-section-card,
.pg-hd,
.tab-pane, .tab-content-inner,
.results-area, .results-panel,
.chart-panel, .chart-wrap,
.land-left, .land-right, .land-cta-box,
.toast, .tooltip-box,
.sidebar-panel, .sidebar-card,
.si-row, .onb-inst-grid > div,
.rec-size-wrap, .sig-exec-row,
.news-card, .news-item,
.port-stat-card, .var-card, .stress-card, .corr-card,
.opt-card, .hist-row, .hist-table-wrap {
  background: rgba(9,8,13,.66) !important;
  backdrop-filter: blur(18px) saturate(160%) brightness(1.05) !important;
  -webkit-backdrop-filter: blur(18px) saturate(160%) brightness(1.05) !important;
  border: 1px solid rgba(237,232,216,.08) !important;
}

/* ── Top shimmer accent on every glass card ── */
.card::before, [class$="-card"]::before, .mkt-section-card::before,
.sig-card::before, .perf-card::before, .alt-card::before,
.port-card::before, .settings-card::before, .onb-box::before,
.calc-body::before, .journey-panel::before, .land-cta-box::before {
  content: '' !important;
  display: block !important;
  position: absolute !important;
  inset: 0 !important;
  border-radius: inherit !important;
  background: linear-gradient(
    160deg,
    rgba(237,232,216,.05) 0%,
    rgba(255,255,255,.02) 40%,
    transparent 100%
  ) !important;
  pointer-events: none !important;
  z-index: 0 !important;
}

/* ── Navigation bar: deepest glass ── */
nav, .nav-bar, .top-nav, header, .app-nav, .dash-nav {
  background: rgba(7,8,11,.80) !important;
  backdrop-filter: blur(24px) saturate(180%) !important;
  -webkit-backdrop-filter: blur(24px) saturate(180%) !important;
  border-bottom: 1px solid rgba(237,232,216,.07) !important;
  border-radius: 0 !important;
}

/* ── Sidebar: glass column ── */
.sidebar, .dash-sidebar, .left-panel {
  background: rgba(8,7,12,.72) !important;
  backdrop-filter: blur(20px) !important;
  -webkit-backdrop-filter: blur(20px) !important;
  border-right: 1px solid rgba(237,232,216,.07) !important;
}

/* ── Inputs: glass fields ── */
input:not([type="range"]):not([type="checkbox"]):not([type="radio"]),
select, textarea {
  background: rgba(7,6,10,.55) !important;
  border: 1px solid rgba(237,232,216,.14) !important;

dow:0 0 16px rgba(232,112,110,.32);transform:translateY(-1px);}

.und-chart-panel{width:100%;height:300px;background:rgba(4,5,8,.7);border:1px solid rgba(237,232,216,.1);border-radius:10px;margin-bottom:16px;overflow:hidden;position:relative;}
.und-chart-inner{width:100%;height:100%;}
.und-chart-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-family:var(--mono);color:var(--t3);}
/* Tier selector */
#tierModal{position:fixed;inset:0;z-index:9999;background:rgba(2,3,6,.93);backdrop-filter:blur(20px);display:none;align-items:center;justify-content:center;}
#tierModal.show{display:flex;}
.tier-modal-box{background:rgba(8,9,14,.96);border:1px solid rgba(237,232,216,.14);border-radius:14px;padding:38px 36px;max-width:520px;width:calc(100% - 40px);}
.tier-modal-title{font-size:20px;font-weight:300;color:var(--t1);letter-spacing:.02em;margin-bottom:6px;}
.tier-modal-sub{font-size:12px;color:var(--t3);margin-bottom:26px;line-height:1.65;}
.tier-opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:24px;}
.tier-opt{padding:18px 12px;border-radius:10px;border:1px solid rgba(237,232,216,.1);background:rgba(237,232,216,.03);cursor:pointer;transition:all .2s;text-align:center;}
.tier-opt:hover{border-color:rgba(237,232,216,.28);background:rgba(237,232,216,.06);}
.tier-opt.active{border-color:rgba(237,232,216,.5);background:rgba(237,232,216,.1);box-shadow:0 0 20px rgba(237,232,216,.1);}
.tier-opt-icon{margin-bottom:10px;display:flex;justify-content:center;}
.tier-opt-name{font-size:11px;font-weight:700;color:var(--t1);letter-spacing:.07em;margin-bottom:5px;}
.tier-opt-desc{font-size:10px;color:var(--t3);line-height:1.55;}
.tier-confirm-btn{width:100%;padding:12px;border-radius:8px;border:none;background:rgba(237,232,216,.12);color:rgba(237,232,216,.9);font-size:11px;font-weight:700;letter-spacing:.08em;cursor:pointer;transition:all .18s;}
.tier-confirm-btn:hover{background:rgba(237,232,216,.22);box-shadow:0 0 16px rgba(237,232,216,.18);}
body.tier-beginner [data-tier="trader"]{display:none!important;}
body.tier-beginner [data-tier="pro"]{display:none!important;}
body.tier-trader [data-tier="beginner"]{display:none!important;}
body.tier-pro [data-tier="beginner"]{display:none!important;}
/* Mode toggle pill in nav */
.mode-toggle-wrap{display:flex;align-items:center;gap:0;background:rgba(237,232,216,.07);border:1px solid rgba(237,232,216,.15);border-radius:20px;padding:2px;margin:0 8px;}
.mode-toggle-btn{padding:4px 11px;border-radius:16px;font-size:10px;font-family:var(--mono);letter-spacing:.5px;color:rgba(237,232,216,.45);cursor:pointer;transition:all .15s;border:none;background:none;}
.mode-toggle-btn.on{background:rgba(237,232,216,.14);color:rgba(237,232,216,.9);font-weight:500;}
/* Beginner plain-English cards */
.beg-card{background:rgba(237,232,216,.05);border:1px solid rgba(237,232,216,.12);border-radius:6px;padding:14px 16px;margin-bottom:10px;}
.beg-card-title{font-size:10px;font-family:var(--mono);letter-spacing:.6px;color:rgba(237,232,216,.45);margin-bottom:6px;}
.beg-card-text{font-size:13px;color:rgba(237,232,216,.75);line-height:1.55;}
.beg-card-text strong{color:rgba(237,232,216,.95);}
.beg-verdict{font-size:13px;font-weight:500;margin-bottom:6px;}
.beg-ind-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid rgba(237,232,216,.06);font-size:12.5px;color:rgba(237,232,216,.7);}
.beg-ind-row:last-child{border-bottom:none;}
.beg-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
body.tier-trader [data-tier="pro"]{display:none!important;}
/* Auto-refresh strip */
.ar-strip{display:flex;align-items:center;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
.ar-strip-lbl{font-size:10px;color:var(--t3);letter-spacing:.05em;margin-right:2px;font-family:var(--mono);}
.ar-btn{font-size:10px;font-family:var(--mono);padding:4px 9px;border-radius:4px;border:1px solid var(--bd);background:rgba(255,255,255,.03);color:var(--mut);cursor:pointer;transition:all .15s;}
.ar-btn:hover{border-color:rgba(237,232,216,.3);color:var(--t2);}
.ar-btn.on{border-color:rgba(237,232,216,.4);color:rgba(237,232,216,.85);background:rgba(237,232,216,.07);box-shadow:0 0 8px rgba(237,232,216,.12);}
.ar-sep{width:1px;height:14px;background:var(--bd);margin:0 4px;}
.ar-status{font-size:9.5px;font-family:var(--mono);color:var(--t3);}
@keyframes arSpin{to{transform:rotate(360deg)}}
.ar-spinner{display:inline-block;width:10px;height:10px;border:1.5px solid rgba(237,232,216,.18);border-top-color:rgba(237,232,216,.8);border-radius:50%;animation:arSpin .8s linear infinite;vertical-align:middle;margin-right:4px;}

/* ── Scanner table ── */
.sc-table-wrap{background:rgba(8,9,14,.68);backdrop-filter:blur(16px);border:1px solid rgba(237,232,216,.09);border-radius:8px;overflow:hidden;}
.sc-filter-row{display:flex;gap:6px;padding:12px 16px;border-bottom:1px solid rgba(237,232,216,.07);flex-wrap:wrap;}

/* ── Scanner R:R + confidence filter row ── */
.sc-rr-row{margin-top:6px;}
.sc-filter-lbl{font-size:10.5px;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;padding:0 4px;align-self:center;}
.sc-rr, .sc-conf, .sc-tf{background:rgba(255,255,255,.03);border:1px solid var(--bd);color:var(--t2);border-radius:6px;padding:4px 10px;font-size:11px;cursor:pointer;transition:all .18s;font-family:var(--mono);}
.sc-rr:hover, .sc-conf:hover, .sc-tf:hover{border-color:var(--crys);color:var(--crys);}
.sc-rr.on, .sc-conf.on, .sc-tf.on{background:var(--crys2);border-color:var(--crys);color:var(--crys);box-shadow:0 0 8px rgba(237,232,216,.18);}
.sc-rr-sep{width:1px;height:20px;background:var(--bd);margin:0 6px;align-self:center;}
.sc-rr-cell{text-align:center;}
.sc-rr-badge{display:inline-block;font-family:var(--mono);font-size:11px;font-weight:700;color:rgba(237,232,216,.9);background:rgba(237,232,216,.1);border:1px solid rgba(237,232,216,.2);border-radius:4px;padding:3px 8px;letter-spacing:.03em;}
.sc-filter{
  font-size:10.5px;font-weight:500;letter-spacing:.04em;
  padding:4px 11px;border-radius:4px;cursor:pointer;
  background:transparent;border:1px solid rgba(237,232,216,.15);
  color:rgba(237,232,216,.5);transition:all .14s;
}
.sc-filter.on,.sc-filter:hover{background:rgba(237,232,216,.08);border-color:rgba(237,232,216,.32);color:rgba(237,232,216,.88);}
.sc-filter.buy.on{background:rgba(93,232,160,.08);border-color:rgba(93,232,160,.3);color:#5de8a0;}
.sc-filter.sell.on{background:rgba(232,112,110,.08);border-color:rgba(232,112,110,.3);color:#e8706e;}
.sc-table{width:100%;border-collapse:collapse;}
.sc-table thead tr{background:rgba(237,232,216,.04);border-bottom:1px solid rgba(237,232,216,.08);}
.sc-table th{padding:9px 14px;font-size:9.5px;font-weight:600;letter-spacing:.07em;color:rgba(237,232,216,.4);text-transform:uppercase;text-align:left;}
.sc-row{border-bottom:1px solid rgba(237,232,216,.05);cursor:pointer;transition:background .13s;user-select:none;}
.sc-row:active{background:rgba(237,232,216,.08) !important;}
.sc-row:last-child{border-bottom:none;}
.sc-row:hover{background:rgba(237,232,216,.04);}
.sc-row td{padding:10px 14px;font-size:12px;}
.sc-sym{font-size:13px;font-weight:500;color:var(--t1);display:block;}
.sc-cls{font-size:9.5px;color:var(--t3);letter-spacing:.04em;text-transform:uppercase;}
.sc-sym-cell{min-width:90px;}
.sc-pill{
  font-size:9px;font-weight:700;letter-spacing:.07em;
  padding:2px 7px;border-radius:3px;display:inline-block;
}
.sc-pill.buy{background:rgba(93,232,160,.09);border:1px solid rgba(93,232,160,.25);color:#5de8a0;}
.sc-pill.sell{background:rgba(232,112,110,.09);border:1px solid rgba(232,112,110,.25);color:#e8706e;}
.sc-pill.hold{background:rgba(237,232,216,.05);border:1px solid rgba(237,232,216,.16);color:rgba(237,232,216,.55);}
.sc-bull-wrap{display:flex;align-items:center;gap:7px;}
.sc-bull-track{flex:1;height:3px;background:rgba(237,232,216,.08);border-radius:2px;min-width:50px;}
.sc-bull-fill{height:100%;background:rgba(93,232,160,.7);border-radius:2px;box-shadow:0 0 5px rgba(93,232,160,.3);}
.sc-bull-pct{font-family:var(--mono);font-size:10px;color:var(--t3);width:30px;}
.sc-price{font-family:var(--mono);font-size:11.5px;color:var(--t1);}
.sc-sltp{font-size:9.5px;color:var(--t3);margin-top:2px;}
.sc-act-btn{
  font-size:10px;font-weight:700;letter-spacing:.04em;
  padding:4px 10px;border-radius:4px;cursor:pointer;white-space:nowrap;
  transition:all .14s;
  /* color/border from gold design language block */
}
.grn{color:var(--grn)!important;}
.red{color:var(--red)!important;}


/* ── UNDERSTAND page ── */
.und-layout{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.und-card{background:rgba(8,9,14,.68);backdrop-filter:blur(16px);border:1px solid rgba(237,232,216,.09);border-radius:8px;padding:16px;position:relative;}
.und-card-title{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:rgba(237,232,216,.45);margin-bottom:12px;}
.und-sig-hero{background:rgba(8,9,14,.68);backdrop-filter:blur(16px);border:1px solid rgba(237,232,216,.1);border-radius:8px;padding:18px;position:relative;}
.und-sig-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px;}
.und-sig-sym{font-size:20px;font-weight:500;font-family:var(--syne);color:var(--t1);letter-spacing:-.02em;}
.und-sig-tf{font-size:11px;color:var(--t3);margin-top:3px;letter-spacing:.04em;}
.und-sig-levels{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
.und-sig-level{padding:10px 12px;background:rgba(237,232,216,.04);border:1px solid rgba(237,232,216,.08);border-radius:6px;}
.und-sig-lbl{font-size:9px;font-weight:600;letter-spacing:.08em;color:var(--t3);text-transform:uppercase;display:block;margin-bottom:4px;}
.und-sig-price{font-family:var(--mono);font-size:16px;font-weight:300;color:var(--t1);}
.und-conf-row{display:flex;align-items:center;gap:14px;padding:14px 0;border-top:1px solid rgba(237,232,216,.07);border-bottom:1px solid rgba(237,232,216,.07);margin-bottom:14px;}
.und-explain{margin-bottom:14px;}
.und-explain-title{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:rgba(237,232,216,.45);margin-bottom:8px;}
.und-explain-body{font-size:12.5px;color:var(--t2);line-height:1.7;}
.und-action-row{display:flex;gap:10px;justify-content:flex-end;}
.und-duration-strip{display:flex;align-items:stretch;gap:0;margin-bottom:14px;border:1px solid rgba(237,232,216,.1);border-radius:7px;overflow:hidden;}
.und-dur-cell{flex:1;padding:9px 12px;display:flex;flex-direction:column;gap:3px;}
.und-dur-cell+.und-dur-cell{border-left:1px solid rgba(237,232,216,.07);}
.und-dur-lbl{font-size:9px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--t3);}
.und-dur-val{font-family:var(--mono);font-size:12px;color:var(--t1);}
.und-dur-sub{font-size:9.5px;color:var(--t3);}
.und-ind-grid{display:flex;flex-direction:column;gap:6px;}
.und-ind{display:flex;align-items:center;gap:10px;padding:8px 10px;background:rgba(237,232,216,.03);border-radius:5px;border:1px solid rgba(237,232,216,.06);}
.und-ind-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.und-ind-body{flex:1;}
.und-ind-name{font-size:12px;color:var(--t1);}
.und-ind-sub{font-size:10px;color:var(--t3);margin-top:1px;}
.und-ind-val{font-size:11.5px;font-weight:500;font-family:var(--mono);}
.und-mtf-row{display:flex;gap:6px;}
.und-mtf-cell{flex:1;padding:10px 8px;background:rgba(237,232,216,.04);border:1px solid rgba(237,232,216,.07);border-radius:6px;text-align:center;}
.und-mtf-tf{font-size:10px;color:var(--t3);letter-spacing:.06em;margin-bottom:5px;}
.und-mtf-sig{font-size:12px;font-weight:600;letter-spacing:.05em;}
.und-reason-body{font-size:12.5px;color:var(--t2);line-height:1.65;}
.und-steps{display:flex;flex-direction:column;gap:0;}
.und-step{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:6px;cursor:pointer;transition:background .13s;opacity:.5;}
.und-step.done{opacity:.5;}
.und-step.active{opacity:1;background:rgba(237,232,216,.05);border:1px solid rgba(237,232,216,.1);}
.und-step:hover{background:rgba(237,232,216,.06);}
.und-step-num{width:22px;height:22px;border-radius:50%;background:rgba(237,232,216,.1);border:1px solid rgba(237,232,216,.2);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:rgba(237,232,216,.8);flex-shrink:0;font-family:var(--mono);}
.und-step.done .und-step-num{background:rgba(93,232,160,.1);border-color:rgba(93,232,160,.3);color:#5de8a0;}
.und-step.active .und-step-num{background:rgba(237,232,216,.15);border-color:rgba(237,232,216,.4);color:rgba(237,232,216,.95);}
.und-step-title{font-size:12px;color:var(--t1);}
.und-step-sub{font-size:10.5px;color:var(--t3);margin-top:1px;}

/* ── SIZE page ── */
.sz-ref-row{display:flex;align-items:center;gap:6px;margin-bottom:4px;}
.sz-ref-chip{font-family:var(--mono);font-size:13px;font-weight:700;padding:5px 10px;border-radius:5px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);}
.sz-ref-chip.entry{color:var(--txt);border-color:rgba(237,232,216,.25);}
.sz-ref-chip.sl{color:#e8706e;border-color:rgba(232,112,110,.3);background:rgba(232,112,110,.05);}
.sz-ref-copy{background:rgba(237,232,216,.1);border:1px solid rgba(237,232,216,.2);border-radius:4px;color:rgba(237,232,216,.8);font-size:9px;font-family:var(--mono);font-weight:700;cursor:pointer;padding:3px 8px;white-space:nowrap;transition:all .15s;}
.sz-ref-copy:hover{background:rgba(237,232,216,.2);color:var(--crys);}
.sz-no-signal{padding:8px 0 12px;font-size:11px;color:var(--mut);font-family:var(--mono);}
.sz-signal-banner{display:flex;align-items:center;gap:8px;padding:8px 12px;background:rgba(237,232,216,.06);border:1px solid rgba(237,232,216,.18);border-radius:6px;margin-bottom:12px;font-size:12px;color:var(--txt);font-family:var(--mono);}
.sz-dir-badge{padding:2px 8px;border-radius:3px;font-size:9px;font-weight:800;letter-spacing:.5px;}
.sz-dir-badge.buy{background:rgba(93,232,160,.18);color:#5de8a0;}
.sz-dir-badge.sell{background:rgba(232,112,110,.18);color:#e8706e;}
.sz-clear-btn{margin-left:auto;background:transparent;border:1px solid rgba(255,255,255,.15);border-radius:4px;color:var(--mut);font-size:10px;font-family:var(--mono);cursor:pointer;padding:3px 8px;}
.sz-layout{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(max-width:760px){.sz-layout{grid-template-columns:1fr;}}
.sz-card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:10px;padding:14px;}
.sz-card-title{font-family:var(--mono);font-size:9px;font-weight:800;letter-spacing:1.2px;color:rgba(237,232,216,.7);text-transform:uppercase;margin-bottom:10px;}
.sz-dir-row{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:14px;}
.sz-dir-btn{padding:8px;border:1px solid rgba(255,255,255,.12);border-radius:6px;background:transparent;color:var(--mut);font-family:var(--mono);font-size:11px;font-weight:700;cursor:pointer;transition:all .15s;}
.sz-dir-btn.long.active{background:rgba(93,232,160,.15);border-color:rgba(93,232,160,.4);color:#5de8a0;}
.sz-dir-btn.short.active{background:rgba(232,112,110,.15);border-color:rgba(232,112,110,.4);color:#e8706e;}
.sz-fields{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.sz-field{display:flex;flex-direction:column;gap:4px;}
.sz-field.full{grid-column:1/-1;}
.sz-lbl{font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.5px;color:rgba(255,255,255,.45);text-transform:uppercase;}
.sz-req{font-size:11px;}
.sz-req.crys{color:var(--crys);}
.sz-req.red{color:#e8706e;}
.sz-inp{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:6px;padding:8px 10px;color:var(--txt);font-family:var(--mono);font-size:13px;outline:none;transition:border .15s;width:100%;box-sizing:border-box;}
.sz-inp:focus{border-color:var(--crys);background:rgba(237,232,216,.07);}
.sz-inp.sz-entry-inp{font-size:15px;font-weight:600;}
.sz-hint{font-size:10px;color:var(--mut);line-height:1.4;}
/* SonarLab results panel */
.sz-right{display:flex;flex-direction:column;gap:0;}
.sz-sonar-box{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:10px;overflow:hidden;}
.sz-sonar-hdr{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.02);}
.sz-sonar-sym{font-family:var(--mono);font-weight:800;font-size:15px;color:var(--txt);}
.sz-sonar-price{font-family:var(--mono);font-size:12px;color:var(--mut);}
.sz-sonar-grid{display:grid;grid-template-columns:1fr 1fr 1fr;border-bottom:1px solid rgba(255,255,255,.05);}
.sz-sonar-cell{padding:9px 10px;border-right:1px solid rgba(255,255,255,.05);}
.sz-sonar-cell:last-child{border-right:none;}
.sz-sonar-lbl{font-family:var(--mono);font-size:8px;letter-spacing:.7px;color:var(--mut);text-transform:uppercase;margin-bottom:3px;}
.sz-sonar-val{font-family:var(--mono);font-weight:700;font-size:15px;color:rgba(255,255,255,.9);}
.sz-sonar-val.sm{font-size:12px;}
.sz-sonar-val.amber{color:#d4b87a;}
.sz-sonar-val.grn{color:#5de8a0;}
.sz-sonar-val.red{color:#e8706e;}
/* R:R bar */
.sz-rr-box{padding:10px;cursor:pointer;transition:background .15s;border-right:1px solid rgba(255,255,255,.06);}
.sz-rr-box:last-child{border-right:none;}
.sz-rr-box.sl{background:rgba(232,112,110,.05);}
.sz-rr-box.best{background:rgba(93,232,160,.04);}
.sz-rr-box:hover{background:rgba(255,255,255,.04);}
.sz-rr-box-lbl{font-family:var(--mono);font-size:8px;letter-spacing:.8px;text-transform:uppercase;color:var(--mut);margin-bottom:4px;}
.sz-rr-box-val{font-family:var(--mono);font-size:17px;font-weight:800;margin-bottom:2px;}
.sz-rr-box-val.red{color:#e8706e;}
.sz-rr-box-val.grn{color:#5de8a0;}
.sz-rr-box-sub{font-family:var(--mono);font-size:9px;color:var(--mut);}
.sz-rr-box-hint{font-family:var(--mono);font-size:8px;color:rgba(255,255,255,.2);margin-top:5px;letter-spacing:.5px;}
/* TP expandable rows */
.sz-tp-row{border-bottom:1px solid rgba(255,255,255,.05);cursor:pointer;transition:background .12s;}
.sz-tp-row:last-child{border-bottom:none;}
.sz-tp-row:hover{background:rgba(255,255,255,.02);}
.sz-tp-main{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;}
.sz-tp-name{font-family:var(--mono);font-size:10px;font-weight:700;color:rgba(255,255,255,.5);letter-spacing:.5px;}
.sz-tp-price{font-family:var(--mono);font-size:12px;color:var(--txt);margin-top:2px;}
.sz-tp-mid{text-align:center;}
.sz-tp-rr{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--crys);}
.sz-tp-hint{font-family:var(--mono);font-size:9px;color:var(--mut);margin-top:2px;}
.sz-tp-profit{font-family:var(--mono);font-size:14px;font-weight:700;}
.sz-tp-profit.grn{color:#5de8a0;}
.sz-tp-expand{font-family:var(--mono);font-size:8px;color:rgba(255,255,255,.2);text-align:right;margin-top:2px;}
.sz-tp-detail{display:none;padding:10px 12px 12px;background:rgba(255,255,255,.02);border-top:1px solid rgba(255,255,255,.04);}
.sz-tp-row.open .sz-tp-detail{display:block;}

.act-trailing-row{display:flex;align-items:center;gap:8px;margin-top:8px;background:rgba(237,232,216,.04);border:1px solid rgba(237,232,216,.07);border-radius:5px;padding:8px 10px;}
.act-trailing-inp{width:60px;background:rgba(237,232,216,.08);border:1px solid rgba(237,232,216,.2);border-radius:4px;color:var(--t1);font-family:var(--mono);font-size:12px;padding:4px 6px;text-align:center;}
.act-trade-sym{display:flex;align-items:center;gap:8px;}
.act-trade-name{font-size:15px;font-weight:500;color:var(--t1);}
.act-trade-tf{font-size:10px;color:var(--t3);letter-spacing:.06em;background:rgba(237,232,216,.06);padding:2px 7px;border-radius:3px;}
.act-trade-pnl{font-family:var(--mono);font-size:16px;font-weight:300;}
.act-trade-pnl.up{color:#5de8a0;}
.act-trade-pnl.dn{color:#e8706e;}
.act-trade-pnl-pct{font-size:11px;margin-left:4px;opacity:.7;}
.act-trade-levels{display:flex;gap:16px;margin-bottom:12px;flex-wrap:wrap;}
.act-trade-lev{display:flex;flex-direction:column;gap:2px;}
.act-lbl{font-size:9px;color:var(--t3);letter-spacing:.06em;text-transform:uppercase;}
.act-val{font-family:var(--mono);font-size:12.5px;color:var(--t1);}
.act-trade-prog{margin-bottom:12px;}

.act-trade-timer-row{display:flex;gap:0;margin-bottom:12px;background:rgba(237,232,216,.04);border:1px solid rgba(237,232,216,.07);border-radius:6px;overflow:hidden;}
.act-timer-cell{flex:1;padding:10px 12px;border-right:1px solid rgba(237,232,216,.07);}
.act-timer-cell:last-child{border-right:none;}
.act-timer-lbl{font-size:9px;color:var(--t3);letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px;}
.act-timer-val{font-family:var(--mono);font-size:12px;color:var(--t1);}
.act-trade-btns{display:flex;gap:8px;}
.act-btn-close{font-size:10.5px;padding:5px 12px;border-radius:5px;cursor:pointer;background:rgba(232,112,110,.08);border:1px solid rgba(232,112,110,.25);color:#e8706e;transition:all .14s;}
.act-btn-close:hover{background:rgba(232,112,110,.14);}
.act-btn-move-sl{font-size:10.5px;padding:5px 12px;border-radius:5px;cursor:pointer;background:rgba(237,232,216,.06);border:1px solid rgba(237,232,216,.18);color:rgba(237,232,216,.75);transition:all .14s;}
.act-btn-move-sl:hover{background:rgba(237,232,216,.12);}


/* ══ CHART VISUALS SETTINGS ══ */

/* Theme grid */
.cv-theme-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px;
}
.cv-theme-card{
  padding:12px;border-radius:7px;cursor:pointer;position:relative;
  background:rgba(237,232,216,.04);
  border:1px solid rgba(237,232,216,.1);
  transition:all .16s;
}
.cv-theme-card:hover{background:rgba(237,232,216,.08);border-color:rgba(237,232,216,.22);}
.cv-theme-card.sel{
  background:rgba(237,232,216,.09);
  border:1px solid rgba(237,232,216,.38);
  box-shadow:0 0 16px rgba(237,232,216,.12);
}
.cv-preview{margin-bottom:8px;border-radius:5px;overflow:hidden;}
.cv-theme-name{font-size:12px;font-weight:500;color:var(--t1);margin-bottom:2px;}
.cv-theme-desc{font-size:10px;color:var(--t3);line-height:1.4;}
.cv-sel-dot{
  position:absolute;top:10px;right:10px;
  width:8px;height:8px;border-radius:50%;
  border:1.5px solid rgba(237,232,216,.3);
  transition:all .15s;
}
.cv-sel-dot.on{
  background:rgba(237,232,216,.9);
  border-color:rgba(237,232,216,.6);
  box-shadow:0 0 8px rgba(237,232,216,.5);
}

/* Chart type selector */
.cv-type-row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
.cv-type-card{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:12px 16px;border-radius:7px;cursor:pointer;min-width:80px;
  background:rgba(237,232,216,.04);border:1px solid rgba(237,232,216,.1);
  color:rgba(237,232,216,.5);transition:all .15s;
}
.cv-type-card:hover{background:rgba(237,232,216,.08);color:rgba(237,232,216,.82);}
.cv-type-card.sel{
  background:rgba(237,232,216,.1);border-color:rgba(237,232,216,.38);
  color:rgba(237,232,216,.92);box-shadow:0 0 12px rgba(237,232,216,.1);
}
.cv-type-label{font-size:10px;font-weight:500;letter-spacing:.04em;white-space:nowrap;}

/* Grid style + indicator scheme options */
.cv-opt-row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
.cv-opt-card{
  padding:10px 14px;border-radius:6px;cursor:pointer;min-width:110px;
  background:rgba(237,232,216,.04);border:1px solid rgba(237,232,216,.1);
  transition:all .15s;
}
.cv-opt-card:hover{background:rgba(237,232,216,.08);border-color:rgba(237,232,216,.22);}
.cv-opt-card.sel{background:rgba(237,232,216,.09);border-color:rgba(237,232,216,.38);}
.cv-opt-label{font-size:12px;font-weight:500;color:var(--t1);margin-bottom:2px;}
.cv-opt-desc{font-size:10px;color:var(--t3);}
.cv-ind-preview{padding:4px 0 0;}

/* Toggle switches */
.cv-viz-options{display:flex;flex-direction:column;gap:0;margin-top:12px;}
.cv-toggle-row{
  display:flex;align-items:center;gap:12px;
  padding:12px 0;border-bottom:1px solid rgba(237,232,216,.07);cursor:pointer;
}
.cv-toggle-row:last-child{border-bottom:none;}
.cv-toggle-lbl{font-size:12.5px;color:var(--t1);flex:1;}
.cv-toggle-sub{font-size:10.5px;color:var(--t3);width:200px;text-align:right;}
.cv-toggle{
  width:38px;height:20px;border-radius:10px;
  background:rgba(237,232,216,.1);border:1px solid rgba(237,232,216,.2);
  position:relative;cursor:pointer;flex-shrink:0;
  transition:background .2s,border-color .2s;
}
.cv-toggle.on{background:rgba(237,232,216,.25);border-color:rgba(237,232,216,.5);}
.cv-toggle-knob{
  position:absolute;top:2px;left:2px;
  width:14px;height:14px;border-radius:50%;
  background:rgba(237,232,216,.5);
  transition:transform .2s,background .2s;
  box-shadow:0 1px 4px rgba(0,0,0,.3);
}
.cv-toggle.on .cv-toggle-knob{
  transform:translateX(18px);
  background:rgba(237,232,216,.9);
  box-shadow:0 0 8px rgba(237,232,216,.4);
}

/* Toast notification */
.dv-toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
  background:rgba(10,12,18,.92);backdrop-filter:blur(16px);
  border:1px solid rgba(237,232,216,.2);border-radius:7px;
  padding:10px 20px;font-size:12px;color:rgba(237,232,216,.9);
  box-shadow:0 8px 32px rgba(0,0,0,.4),0 0 16px rgba(237,232,216,.08);
  z-index:9999;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;
}
.dv-toast.show{opacity:1;transform:translateX(-50%) translateY(0);}


/* ── Pipeline breadcrumb active state ── */
.npp{cursor:pointer;padding:4px 10px;border-radius:6px;font-size:11px;letter-spacing:.08em;color:var(--t3);transition:all .2s;font-family:var(--mono);}
.npp.active{color:var(--crys);background:rgba(237,232,216,.1);border:1px solid rgba(237,232,216,.35);box-shadow:0 0 10px rgba(237,232,216,.1);font-weight:600;}
.npp:hover:not(.active){color:var(--t2);}

/* ── Flow footer — guided next step bar ── */
.flow-footer{display:flex;align-items:center;justify-content:space-between;margin-top:28px;padding:16px 20px;background:var(--s1);border:1px solid var(--bd);border-radius:12px;backdrop-filter:blur(12px);}
.flow-footer-left{display:flex;align-items:center;gap:10px;}
.flow-footer-step{font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.08em;}
.flow-footer-msg{font-size:13px;color:var(--t2);}
.flow-footer-right{display:flex;gap:8px;}
.flow-btn-next{padding:8px 18px;border-radius:8px;font-size:12px;cursor:pointer;transition:all .2s;letter-spacing:.04em;}
/* flow-btn-next color handled by gold design language block */
.flow-btn-back{background:transparent;border:1px solid var(--bd);color:var(--t3);padding:8px 14px;border-radius:8px;font-size:12px;cursor:pointer;transition:all .2s;}
.flow-btn-back:hover{border-color:var(--t3);color:var(--t2);}

/* ── Empty state ── */
.flow-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:320px;gap:14px;text-align:center;}
.flow-empty-icon{width:48px;height:48px;border-radius:50%;background:var(--crys2);border:1px solid rgba(237,232,216,.2);display:flex;align-items:center;justify-content:center;}
.flow-empty-title{font-size:16px;color:var(--t1);}
.flow-empty-sub{font-size:13px;color:var(--t3);max-width:340px;line-height:1.6;}

/* ── Progress dots ── */
.flow-progress{display:flex;align-items:center;gap:6px;margin-bottom:20px;}
.flow-dot{width:6px;height:6px;border-radius:50%;background:var(--bd);transition:all .3s;}
.flow-dot.done{background:var(--grn);}
.flow-dot.active{width:18px;border-radius:3px;background:var(--crys);box-shadow:0 0 8px rgba(237,232,216,.4);}

/* ── Clean heatmap (replace tacky version) ── */
.mkt-heatmap{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.mkt-heat-cell{padding:10px 6px;border-radius:6px;text-align:center;cursor:pointer;transition:all .15s;border:1px solid transparent;position:relative;}
.mkt-heat-cell:hover{filter:brightness(1.2);border-color:rgba(255,255,255,.15);transform:scale(1.04);box-shadow:0 4px 12px rgba(0,0,0,.4);}
.mkt-heat-cell::after{content:'→ Scan';position:absolute;bottom:2px;left:50%;transform:translateX(-50%);font-size:7px;font-family:var(--mono);color:rgba(255,255,255,.45);opacity:0;transition:opacity .15s;letter-spacing:.04em;white-space:nowrap;}
.mkt-heat-cell:hover::after{opacity:1;}
.mkt-heat-sym{font-size:11px;font-weight:500;color:rgba(255,255,255,.9);margin-bottom:3px;}
.mkt-heat-val{font-size:11px;font-family:var(--mono);color:rgba(255,255,255,.75);}

/* ═══════════════════════════════════════════════════════════════ */

.dv-cmd-bar{margin-bottom:16px;display:flex;flex-direction:column;gap:8px;}
.dv-cmd-row1{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.dv-cmd-row2,.dv-cmd-row3{display:flex;align-items:center;gap:4px;flex-wrap:wrap;}
.dv-ticker-inp{flex:1;min-width:160px;max-width:280px;background:rgba(237,232,216,.06);border:1px solid rgba(237,232,216,.2);border-radius:6px;padding:8px 12px;font-family:var(--mono);font-size:13px;color:var(--t1);outline:none;}
.dv-ticker-inp:focus{border-color:rgba(237,232,216,.5);box-shadow:0 0 0 2px rgba(237,232,216,.1);}
.dv-analyze-btn{background:rgba(237,232,216,.12);border:1px solid rgba(237,232,216,.3);color:rgba(237,232,216,.9);font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.04em;padding:8px 16px;border-radius:6px;cursor:pointer;display:flex;align-items:center;gap:6px;transition:all .15s;white-space:nowrap;}
.dv-analyze-btn:hover{background:rgba(237,232,216,.22);box-shadow:0 0 14px rgba(237,232,216,.2);}
.dv-rb-wrap{display:flex;align-items:center;gap:3px;margin-left:auto;}
.dv-rb-btn{background:none;border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.35);font-family:var(--mono);font-size:9px;padding:4px 7px;border-radius:3px;cursor:pointer;transition:all .15s;}
.dv-rb-btn.active,.dv-rb-btn:hover{color:rgba(201,168,76,.9);border-color:rgba(201,168,76,.4);background:rgba(201,168,76,.08);}
.dv-rb-spin{width:10px;height:10px;border:2px solid rgba(201,168,76,.3);border-top-color:rgba(201,168,76,.8);border-radius:50%;display:none;animation:dvspin .8s linear infinite;}
.dv-rb-spin.active{display:block;}
@keyframes dvspin{to{transform:rotate(360deg)}}
.dv-at-pill,.dv-tf-pill{background:none;border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.4);font-family:var(--mono);font-size:10px;padding:4px 10px;border-radius:20px;cursor:pointer;transition:all .15s;}
.dv-at-pill.active,.dv-at-pill:hover,.dv-tf-pill.active,.dv-tf-pill:hover{color:rgba(237,232,216,.9);border-color:rgba(237,232,216,.4);background:rgba(237,232,216,.08);}
.dv-inst-chip{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.5);font-family:var(--mono);font-size:10px;padding:4px 10px;border-radius:4px;cursor:pointer;transition:all .15s;}
.dv-inst-chip:hover{color:rgba(237,232,216,.9);border-color:rgba(237,232,216,.4);background:rgba(237,232,216,.08);box-shadow:0 0 8px rgba(237,232,216,.15);}
.dv-trade-alert{display:flex;align-items:center;gap:8px;background:rgba(201,168,76,.08);border:1px solid rgba(201,168,76,.25);border-radius:6px;padding:9px 14px;margin-bottom:12px;font-family:var(--mono);font-size:11px;color:rgba(201,168,76,.9);}
.dv-trade-alert strong{font-weight:700;letter-spacing:.05em;}
.dv-info-strip{display:flex;gap:0;border:1px solid rgba(255,255,255,.07);border-radius:8px;overflow:hidden;margin-bottom:16px;}
.dv-ic{flex:1;padding:10px 12px;border-right:1px solid rgba(255,255,255,.06);transition:background .15s;}
.dv-ic:last-child{border-right:none;}
.dv-ic:hover{background:rgba(237,232,216,.05);}
.dv-ic-lbl{font-family:var(--mono);font-size:9px;color:rgba(255,255,255,.3);letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px;}
.dv-ic-val{font-family:var(--mono);font-size:14px;font-weight:600;color:var(--t1);}

/* ══════════════════════════════════════════════════════════════════
   GOLD SELECTION DESIGN LANGUAGE
   Applied consistently everywhere a user selects / activates state.
   Pattern: dark card + gold border + gold icon/text + subtle glow.
   Token map:  --sel-bg  = subtle gold tint background
               --sel-bd  = gold border
               --sel-glow= ambient glow
               --sel-txt = readable gold text
   ══════════════════════════════════════════════════════════════════ */
:root{
  --sel-bg:   rgba(255,255,255,.06);
  --sel-bd:   rgba(201,168,76,.48);
  --sel-glow: rgba(201,168,76,.22);
  --sel-txt:  #c9a84c;
}

/* ═══════════════════════════════════════════════
   DESIGN SYSTEM OVERRIDE — Gold + Warm White
   Replaces hardcoded rgba(148,175,220) blue-silver
   across all key components
═══════════════════════════════════════════════ */

/* ─── Sidebar nav items ─── */
.nav-item.active, .nav-item.on{

  border: 1px solid var(--sel-bd) !important;

}
.nav-item.active span:not(.nav-badge):not(.nav-step-tag):not(.nav-desc),

  color: var(--sel-txt) !important;

.nav-item.active svg, .nav-item.on svg{

  stroke: rgba(201,168,76,.8);

/* ── MT5 trade card button glow animations ── */
@keyframes mt5BtnGlowG{0%,100%{box-shadow:0 0 0 0 rgba(93,232,160,0)}50%{box-shadow:0 0 8px 2px rgba(93,232,160,.22)}}
@keyframes mt5BtnGlowR{0%,100%{box-shadow:0 0 0 0 rgba(232,112,110,0)}50%{box-shadow:0 0 8px 2px rgba(232,112,110,.22)}}
@keyframes mt5BtnGlowA{0%,100%{box-shadow:0 0 0 0 rgba(201,168,76,0)}50%{box-shadow:0 0 8px 2px rgba(201,168,76,.22)}}
@keyframes mt5BlinkGreen{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes mt5BlinkRed{0%,100%{opacity:1}50%{opacity:.25}}
/* ── Per-trade automation toggle switch ── */
.ta-switch{position:relative;display:inline-block;width:30px;height:16px;flex-shrink:0;}
.ta-switch input{opacity:0;width:0;height:0;position:absolute;}
.ta-slider{position:absolute;inset:0;background:rgba(237,232,216,.08);border:1px solid rgba(237,232,216,.15);border-radius:100px;cursor:pointer;transition:.2s;}
.ta-slider:before{content:'';position:absolute;height:10px;width:10px;left:2px;bottom:2px;background:rgba(237,232,216,.4);border-radius:50%;transition:.2s;}
input:checked + .ta-slider{background:rgba(201,168,76,.25);border-color:rgba(201,168,76,.55);}
input:checked + .ta-slider:before{transform:translateX(14px);background:#c9a84c;}

/* ─── BACKTEST TAB ─────────────────────────────────────────── */
.bt-ticker-btn{padding:4px 8px;border-radius:5px;border:1px solid var(--bd);background:var(--s2);color:var(--t2);font-family:var(--mono);font-size:10px;cursor:pointer;transition:all .15s;}
.bt-ticker-btn:hover,.bt-ticker-btn.active{border-color:var(--crys-bord);color:var(--crys);background:var(--crys2);box-shadow:0 0 8px var(--crys-glow);}
.bt-tf-btn{padding:4px 10px;border-radius:5px;border:1px solid var(--bd);background:var(--s2);color:var(--t2);font-family:var(--mono);font-size:10px;cursor:pointer;transition:all .15s;}
.bt-tf-btn:hover{border-color:var(--crys-bord);color:var(--crys);}
.bt-tf-btn.active{background:var(--crys2);border-color:var(--crys-bord);color:var(--crys);box-shadow:0 0 6px var(--crys-glow);}
.bt-refresh-btn{padding:4px 8px;border-radius:5px;border:1px solid var(--bd);background:var(--s2);color:var(--t2);font-family:var(--mono);font-size:10px;cursor:pointer;transition:all .15s;}
.bt-refresh-btn:hover,.bt-refresh-btn.active{border-color:var(--gold-bord);color:var(--gold);background:var(--gold2);}
.bt-strat-btn{padding:5px 10px;border-radius:5px;border:1px solid var(--bd);background:var(--s2);color:var(--t2);font-family:var(--mono);font-size:10px;cursor:pointer;transition:all .15s;}
.bt-strat-btn:hover{border-color:var(--crys-bord);color:var(--crys);}
.bt-strat-btn.active{background:var(--crys2);border-color:var(--crys-bord);color:var(--crys);}
.bt-stat{padding:12px;background:var(--s2);border-radius:8px;border:1px solid var(--bd);cursor:pointer;position:relative;transition:border-color .15s;}
.bt-stat:hover{border-color:var(--crys-bord);}
.bt-stat-detail{display:none;margin-top:8px;padding-top:8px;border-top:1px solid var(--bd);font-family:var(--mono);font-size:10px;color:var(--t2);line-height:1.6;}
.bt-active{background:rgba(93,232,160,.08)!important;}
.pine-code{font-family:var(--mono);font-size:10px;color:var(--t1);background:var(--s1);padding:14px 16px;overflow-x:auto;white-space:pre;line-height:1.6;margin:0;}
.ptb.active{background:var(--crys2)!important;border-color:var(--crys-bord)!important;color:var(--crys)!important;}

/* ═══════════════════════════════════════════════════════════════
   UNIFIED BUTTON SYSTEM — DotVerse
   One design language for every control, pill, tab, and filter.
   Law: gold lives on text / border / glow — never as a bg fill.
   ═══════════════════════════════════════════════════════════════ */

/* ── Shared base — all selector / pill / filter / tab buttons ── */
.npp, .gpill, .scan-filter-btn, .ar-btn,
.dv-inst-chip, .dv-at-pill, .dv-tf-pill,
.bt-ticker-btn, .bt-strat-btn, .ptb, .sz-dir-btn, .sz-clear-btn {

  border-radius: 6px !important;
  font-family: var(--mono) !important;
  letter-spacing: .06em !important;
  cursor: pointer !important;
  transition: border-color .15s ease, color .15s ease, box-shadow .15s ease, background .15s ease !important;
}

/* ── Hover — inactive only ── */
.npp:hover:not(.active),
.gpill:hover:not(.active),
.scan-filter-btn:hover:not(.active),
.ar-btn:hover:not(.active),
.dv-inst-chip:hover,
.dv-at-pill:hover:not(.active),
.dv-tf-pill:hover:not(.active),
.bt-ticker-btn:hover:not(.active),
.bt-strat-btn:hover:not(.active),
.ptb:hover:not(.active),
.sz-dir-btn:hover:not(.active),
.sz-clear-btn:hover {

  color: rgba(237,232,216,.82) !important;

  background: rgba(255,255,255,.04) !important;

.gpill.active,
.scan-filter-btn.active,
.ar-btn.active,
.dv-at-pill.active, .dv-tf-pill.active,
.bt-ticker-btn.active,

.ctx-grid{

.ctx-card{

}

}

}

}

.ctx-card.warn{ border-color:rgba(201,168,76,.3); }
.ctx-card.bad{ border-color:rgba(232,112,110,.2); }
.ctx-card-dot{
  width:7px;height:7px;border-radius:50%;
  display:inline-block;margin-right:5px;vertical-align:middle;
}
.ctx-card-dot.ok{ background:#5de8a0; box-shadow:0 0 6px rgba(93,232,160,.5); }
.ctx-card-dot.warn{ background:#c9a84c; box-shadow:0 0 6px rgba(201,168,76,.5); }
.ctx-card-dot.bad{ background:#e8706e; box-shadow:0 0 6px rgba(232,112,110,.5); }

.ctx-corr-row{

}
.ctx-corr-pill{

  border:1px solid rgba(237,232,216,.1);

}
.ctx-corr-pill.bull{ color:#5de8a0; border-color:rgba(93,232,160,.25); }
.ctx-corr-pill.bear{ color:#e8706e; border-color:rgba(232,112,110,.25); }
.ctx-corr-pill.neut{ color:rgba(237,232,216,.4); border-color:rgba(237,232,216,.12); }

/* Verdict card */
.ctx-verdict{

  padding:20px 22px;
  margin:18px 0 14px;
  display:flex;align-items:center;gap:18px;
}
.ctx-verdict.go{
  background:rgba(93,232,160,.07);
  border:1px solid rgba(93,232,160,.28);
}
.ctx-verdict.caution{
  background:rgba(201,168,76,.07);
  border:1px solid rgba(201,168,76,.3);
}
.ctx-verdict.wait{
  background:rgba(232,112,110,.06);
  border:1px solid rgba(232,112,110,.22);
}
.ctx-verdict-icon{
  width:44px;height:44px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.ctx-verdict.go .ctx-verdict-icon{ background:rgba(93,232,160,.15); }
.ctx-verdict.caution .ctx-verdict-icon{ background:rgba(201,168,76,.15); }
.ctx-verdict.wait .ctx-verdict-icon{ background:rgba(232,112,110,.12); }
.ctx-verdict-text{ flex:1; }
.ctx-verdict-label{
  font-family:var(--syne);font-size:18px;font-weight:700;
  letter-spacing:-.01em;margin-bottom:4px;
}
.ctx-verdict.go .ctx-verdict-label{ color:#5de8a0; }
.ctx-verdict.caution .ctx-verdict-label{ color:#c9a84c; }
.ctx-verdict.wait .ctx-verdict-label{ color:#e8706e; }
.ctx-verdict-reason{
  font-family:var(--ui);font-size:12px;
  color:rgba(237,232,216,.6);line-height:1.5;
}

/* AI Health Check */
.ctx-ai-card{
  background:rgba(255,248,230,.02);
  border:1px solid rgba(201,168,76,.18);
  border-radius:10px;
  padding:16px 18px;
  margin-bottom:14px;
}
.ctx-ai-header{
  display:flex;align-items:center;gap:10px;
  margin-bottom:10px;
}
.ctx-ai-pulse{
  width:8px;height:8px;border-radius:50%;
  background:#c9a84c;
  box-shadow:0 0 0 0 rgba(201,168,76,.4);
  animation:ctxPulse 2s ease-out infinite;
}
@keyframes ctxPulse{
  0%{box-shadow:0 0 0 0 rgba(201,168,76,.5);}
  60%{box-shadow:0 0 0 8px rgba(201,168,76,0);}
  100%{box-shadow:0 0 0 0 rgba(201,168,76,0);}
}
.ctx-ai-title{
  font-family:var(--mono);font-size:10px;letter-spacing:.08em;
  color:rgba(237,232,216,.55);text-transform:uppercase;
}
.ctx-ai-body{
  font-family:var(--ui);font-size:12px;
  color:rgba(237,232,216,.7);line-height:1.65;
}

/* Liquidity sweep bar */
.ctx-sweep-bar{
  height:4px;border-radius:2px;
  background:rgba(237,232,216,.08);
  margin-top:8px;overflow:hidden;
}
.ctx-sweep-fill{
  height:100%;border-radius:2px;
  background:linear-gradient(90deg,#c9a84c,#f0b952);
  transition:width .5s ease-out;
}
